<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackRFComms</title>

    <!-- React 18 from CDN -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX transpilation in browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

    <!-- Tailwind CSS from CDN (no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        panel: '#16213e',
                        sidebar: '#0f3460',
                        base: '#1a1a2e',
                        accent: '#00d2ff',
                        alert: '#e94560',
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Leaflet for ADS-B map (Phase 5) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>



    <style>
        body { margin: 0; background: #1a1a2e; color: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ── Error boundary — catches per-page crashes without killing the app ──
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { error: null }; }
            static getDerivedStateFromError(e) { return { error: e }; }
            render() {
                if (this.state.error) {
                    return (
                        <div className="flex flex-col items-center justify-center h-full gap-3 text-sm">
                            <span className="text-2xl" style={{ color: '#e94560' }}>⚠</span>
                            <span className="text-gray-400">Page error: {this.state.error.message}</span>
                            <button
                                onClick={() => this.setState({ error: null })}
                                className="text-xs px-3 py-1.5 rounded"
                                style={{ background: '#0f3460', color: '#00d2ff', border: '1px solid #00d2ff' }}
                            >Retry</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ═══════════════════════════════════════════════════════
        // PHASE 1: APP SHELL — sidebar, header, routing, health
        // ═══════════════════════════════════════════════════════
        // PHASE 2: DEVICE DASHBOARD
        // ═══════════════════════════════════════════════════════

        const NAV_ITEMS = [
            { id: 'dashboard', label: 'Dashboard',  icon: '⬡' },
            { id: 'comms',     label: 'Comms',      icon: '⇄' },
            { id: 'scanner',   label: 'Scanner',    icon: '⊶' },
            { id: 'adsb',      label: 'ADS-B',      icon: '✈' },
            { id: 'fm',        label: 'FM Radio',   icon: '◉' },
            { id: 'signals',   label: 'Signals',    icon: '∿' },
            { id: 'flipper',   label: 'Flipper',    icon: '⌨' },
        ];

        // ── StatusDot ──────────────────────────────────────────
        function StatusDot({ connected }) {
            return (
                <span
                    title={connected === null ? 'Connecting…' : connected ? 'Connected' : 'Disconnected'}
                    className="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0"
                    style={{
                        background: connected === null ? '#6b7280' : connected ? '#22c55e' : '#e94560',
                        boxShadow: connected ? '0 0 6px #22c55e' : 'none',
                    }}
                />
            );
        }

        // ── Page stubs ─────────────────────────────────────────
        function PageStub({ title, icon, description }) {
            return (
                <div className="flex flex-col items-center justify-center h-full min-h-64 gap-4 text-gray-500">
                    <span className="text-5xl opacity-30">{icon}</span>
                    <div className="text-center">
                        <p className="text-lg font-semibold text-gray-400">{title}</p>
                        <p className="text-sm mt-1">{description || 'Coming in a future phase.'}</p>
                    </div>
                </div>
            );
        }

        // ── DeviceCard ─────────────────────────────────────────
        function DeviceCard({ device }) {
            const isFlipper = device.label === 'Flipper Zero';
            const connected = device.connected;

            let statusColor, statusText;
            if (isFlipper) {
                statusColor = '#6b7280';
                statusText  = 'manual';
            } else if (connected) {
                statusColor = '#22c55e';
                statusText  = 'connected';
            } else {
                statusColor = '#e94560';
                statusText  = 'not found';
            }

            return (
                <div
                    className="rounded-lg p-4 flex flex-col gap-3"
                    style={{ background: '#16213e', border: `1px solid ${connected ? '#1e4a3f' : isFlipper ? '#2a2a4a' : '#4a1e2a'}` }}
                >
                    <div className="flex items-center justify-between">
                        <div>
                            <span className="text-sm font-semibold text-gray-200">{device.label}</span>
                            <span
                                className="ml-2 text-xs px-1.5 py-0.5 rounded"
                                style={{ background: '#0f3460', color: '#00d2ff' }}
                            >
                                {device.role}
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 text-xs" style={{ color: statusColor }}>
                            <span
                                className="w-2 h-2 rounded-full inline-block"
                                style={{ background: statusColor, boxShadow: connected && !isFlipper ? `0 0 5px ${statusColor}` : 'none' }}
                            />
                            {statusText}
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-xs" style={{ fontFamily: 'monospace' }}>
                        <span className="text-gray-500">Serial</span>
                        <span className="text-gray-300 truncate" title={device.serial}>{device.serial}</span>
                        <span className="text-gray-500">Firmware</span>
                        <span className="text-gray-300">{device.firmware || '—'}</span>
                        <span className="text-gray-500">Hardware</span>
                        <span className="text-gray-300">{device.hardware || '—'}</span>
                    </div>
                </div>
            );
        }

        // ── ProtocolTable ──────────────────────────────────────
        function ProtocolTable({ protocols }) {
            return (
                <div className="rounded-lg overflow-hidden" style={{ border: '1px solid #1e3a5f' }}>
                    <table className="w-full text-xs" style={{ borderCollapse: 'collapse' }}>
                        <thead>
                            <tr style={{ background: '#0f3460', color: '#94a3b8' }}>
                                <th className="text-left px-4 py-2 font-medium">Protocol</th>
                                <th className="text-left px-4 py-2 font-medium">Frequency</th>
                                <th className="text-left px-4 py-2 font-medium">Sample Rate</th>
                                <th className="text-left px-4 py-2 font-medium hidden md:table-cell">Description</th>
                            </tr>
                        </thead>
                        <tbody>
                            {protocols.map((p, i) => (
                                <tr
                                    key={p.name}
                                    style={{
                                        background: i % 2 === 0 ? '#16213e' : '#1a2540',
                                        borderTop: '1px solid #1e3a5f',
                                    }}
                                >
                                    <td className="px-4 py-2 font-semibold" style={{ color: '#00d2ff', fontFamily: 'monospace' }}>
                                        {p.name}
                                    </td>
                                    <td className="px-4 py-2 text-gray-300" style={{ fontFamily: 'monospace' }}>
                                        {p.freq_mhz != null ? `${p.freq_mhz} MHz` : '—'}
                                    </td>
                                    <td className="px-4 py-2 text-gray-300" style={{ fontFamily: 'monospace' }}>
                                        {p.sample_rate_mhz} MS/s
                                    </td>
                                    <td className="px-4 py-2 text-gray-400 hidden md:table-cell">{p.description}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        // ── DashboardPage ──────────────────────────────────────
        function DashboardPage() {
            const [devices, setDevices]     = useState(null);
            const [protocols, setProtocols] = useState(null);
            const [error, setError]         = useState(null);

            const fetchAll = useCallback(() => {
                Promise.all([
                    fetch('/api/devices').then(r => r.json()),
                    fetch('/api/protocols').then(r => r.json()),
                ]).then(([devData, protoData]) => {
                    setDevices(devData.devices);
                    setProtocols(protoData.protocols);
                    setError(null);
                }).catch(() => setError('Failed to load device data.'));
            }, []);

            useEffect(() => {
                fetchAll();
                const id = setInterval(fetchAll, 5000);
                return () => clearInterval(id);
            }, [fetchAll]);

            if (error) {
                return (
                    <div className="flex items-center justify-center h-full text-sm" style={{ color: '#e94560' }}>
                        {error}
                    </div>
                );
            }

            if (!devices || !protocols) {
                return (
                    <div className="flex items-center justify-center h-full text-sm text-gray-500">
                        Loading…
                    </div>
                );
            }

            return (
                <div className="flex flex-col gap-6 max-w-4xl">
                    {/* Device cards */}
                    <div>
                        <h2 className="text-xs font-semibold tracking-widest text-gray-500 uppercase mb-3">Devices</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {devices.map(d => <DeviceCard key={d.serial} device={d} />)}
                        </div>
                    </div>

                    {/* Protocol table */}
                    <div>
                        <h2 className="text-xs font-semibold tracking-widest text-gray-500 uppercase mb-3">Protocols</h2>
                        <ProtocolTable protocols={protocols} />
                    </div>
                </div>
            );
        }
        // ═══════════════════════════════════════════════════════
        // PHASE 3: OOK COMMS PANEL
        // ═══════════════════════════════════════════════════════

        function CommsPage() {
            const [messages, setMessages]   = useState([]);   // {id, dir, text, ts}
            const [input, setInput]         = useState('');
            const [sending, setSending]     = useState(false);
            const [listening, setListening] = useState(false);
            const [wsStatus, setWsStatus]   = useState('idle'); // idle | connecting | open | error
            const wsRef   = useRef(null);
            const logRef  = useRef(null);
            const msgId   = useRef(0);

            // Auto-scroll log on new messages
            useEffect(() => {
                if (logRef.current) {
                    logRef.current.scrollTop = logRef.current.scrollHeight;
                }
            }, [messages]);

            // Cleanup WS on unmount
            useEffect(() => () => wsRef.current?.close(), []);

            function addMsg(dir, text, ts) {
                setMessages(prev => [...prev, { id: msgId.current++, dir, text, ts: ts || new Date().toISOString() }]);
            }

            async function handleSend() {
                const text = input.trim();
                if (!text || sending) return;
                setSending(true);
                addMsg('sent', text);
                setInput('');
                try {
                    const res = await fetch('/api/comms/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text }),
                    });
                    const data = await res.json();
                    if (!data.success) {
                        addMsg('system', data.error || 'Send failed — no ACK received.');
                    }
                } catch {
                    addMsg('system', 'Send request failed.');
                } finally {
                    setSending(false);
                }
            }

            function handleKeyDown(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            }

            function startListening() {
                if (wsRef.current) return;
                setWsStatus('connecting');
                const ws = new WebSocket(`ws://${location.host}/ws/comms`);
                wsRef.current = ws;

                ws.onopen  = () => { setListening(true); setWsStatus('open'); };
                ws.onclose = () => { wsRef.current = null; setListening(false); setWsStatus('idle'); };
                ws.onerror = () => { setWsStatus('error'); };
                ws.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        addMsg('received', msg.data, msg.timestamp);
                    } catch {}
                };
            }

            function stopListening() {
                wsRef.current?.close();
            }

            const wsColors = { idle: '#6b7280', connecting: '#f59e0b', open: '#22c55e', error: '#e94560' };
            const wsLabels = { idle: 'idle', connecting: 'connecting…', open: 'listening', error: 'error' };

            return (
                <div className="flex flex-col gap-4 max-w-2xl h-full" style={{ maxHeight: 'calc(100vh - 120px)' }}>

                    {/* Listen toggle */}
                    <div className="flex items-center justify-between rounded-lg px-4 py-3" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                        <div className="flex items-center gap-2 text-sm">
                            <span
                                className="w-2 h-2 rounded-full"
                                style={{ background: wsColors[wsStatus], boxShadow: wsStatus === 'open' ? `0 0 5px ${wsColors.open}` : 'none' }}
                            />
                            <span className="text-gray-400">RX status:</span>
                            <span style={{ color: wsColors[wsStatus] }}>{wsLabels[wsStatus]}</span>
                        </div>
                        <button
                            onClick={listening ? stopListening : startListening}
                            className="text-xs px-3 py-1.5 rounded font-semibold transition-colors"
                            style={{
                                background: listening ? '#4a1e2a' : '#1e3a5f',
                                color: listening ? '#e94560' : '#00d2ff',
                                border: `1px solid ${listening ? '#e94560' : '#00d2ff'}`,
                            }}
                        >
                            {listening ? 'Stop Listening' : 'Start Listening'}
                        </button>
                    </div>

                    {/* Message log */}
                    <div
                        ref={logRef}
                        className="flex-1 overflow-y-auto rounded-lg p-3 flex flex-col gap-2"
                        style={{ background: '#16213e', border: '1px solid #1e3a5f', minHeight: '200px' }}
                    >
                        {messages.length === 0 && (
                            <div className="flex-1 flex items-center justify-center text-sm text-gray-600">
                                No messages yet.
                            </div>
                        )}
                        {messages.map(m => {
                            const isSent   = m.dir === 'sent';
                            const isSystem = m.dir === 'system';
                            const ts = new Date(m.ts).toLocaleTimeString();

                            if (isSystem) {
                                return (
                                    <div key={m.id} className="text-center text-xs py-1" style={{ color: '#e94560' }}>
                                        ⚠ {m.text}
                                    </div>
                                );
                            }

                            return (
                                <div key={m.id} className={`flex flex-col gap-0.5 ${isSent ? 'items-end' : 'items-start'}`}>
                                    <div
                                        className="px-3 py-2 rounded-lg text-sm max-w-xs break-words"
                                        style={{
                                            background: isSent ? '#1e3a5f' : '#1e3a2f',
                                            color: isSent ? '#00d2ff' : '#22c55e',
                                            fontFamily: 'monospace',
                                        }}
                                    >
                                        {m.text}
                                    </div>
                                    <span className="text-xs text-gray-600">{ts}</span>
                                </div>
                            );
                        })}
                    </div>

                    {/* Input */}
                    <div className="flex gap-2">
                        <input
                            type="text"
                            value={input}
                            onChange={e => setInput(e.target.value)}
                            onKeyDown={handleKeyDown}
                            placeholder="Type a message… (Enter to send)"
                            disabled={sending}
                            className="flex-1 px-3 py-2 rounded text-sm outline-none"
                            style={{
                                background: '#16213e',
                                border: '1px solid #1e3a5f',
                                color: '#e2e8f0',
                                fontFamily: 'monospace',
                                opacity: sending ? 0.6 : 1,
                            }}
                        />
                        <button
                            onClick={handleSend}
                            disabled={sending || !input.trim()}
                            className="px-4 py-2 rounded text-sm font-semibold transition-colors"
                            style={{
                                background: sending || !input.trim() ? '#1e3a5f' : '#00d2ff',
                                color: sending || !input.trim() ? '#4a6a8f' : '#0f3460',
                                cursor: sending || !input.trim() ? 'not-allowed' : 'pointer',
                            }}
                        >
                            {sending ? 'Sending…' : 'Send'}
                        </button>
                    </div>
                </div>
            );
        }
        // ═══════════════════════════════════════════════════════
        // PHASE 4: SPECTRUM SCANNER — Canvas-based chart (no CDN deps)
        // ═══════════════════════════════════════════════════════

        const SCAN_PRESETS = [
            { label: 'ISM 915',  start: 900,  end: 930  },
            { label: 'FM',       start: 88,   end: 108  },
            { label: 'Wide',     start: 400,  end: 1700 },
            { label: 'Full',     start: 1,    end: 6000 },
        ];

        const KNOWN_BANDS = [
            [88,   108,  'FM',   'rgba(0,210,255,0.08)'],
            [433,  435,  'ISM',  'rgba(34,197,94,0.08)'],
            [902,  928,  'ISM',  'rgba(34,197,94,0.08)'],
            [700,  900,  'Cell', 'rgba(168,85,247,0.08)'],
            [1700, 2200, 'Cell', 'rgba(168,85,247,0.08)'],
            [2400, 2500, 'WiFi', 'rgba(245,158,11,0.08)'],
            [5150, 5850, 'WiFi', 'rgba(245,158,11,0.08)'],
        ];

        function drawSpectrum(canvas, data, peak) {
            if (!canvas || !data || data.length === 0) return;
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;
            const PAD = { top: 12, right: 16, bottom: 32, left: 48 };
            const CW = W - PAD.left - PAD.right;
            const CH = H - PAD.top - PAD.bottom;

            const freqs  = data.map(d => d.freq);
            const powers = data.map(d => d.power);
            const fMin = freqs[0], fMax = freqs[freqs.length - 1];
            const pMin = Math.min(...powers) - 2;
            const pMax = Math.max(...powers) + 2;
            const fRange = fMax - fMin || 1;
            const pRange = pMax - pMin || 1;

            const fx = f  => PAD.left + ((f - fMin) / fRange) * CW;
            const py = p  => PAD.top  + ((pMax - p)  / pRange) * CH;

            // Background
            ctx.fillStyle = '#0f1a2e';
            ctx.fillRect(0, 0, W, H);

            // Band shading
            KNOWN_BANDS.forEach(([bs, be, label, color]) => {
                const x1 = Math.max(fx(bs), PAD.left);
                const x2 = Math.min(fx(be), PAD.left + CW);
                if (x2 <= x1) return;
                ctx.fillStyle = color;
                ctx.fillRect(x1, PAD.top, x2 - x1, CH);
                ctx.fillStyle = 'rgba(150,150,150,0.4)';
                ctx.font = '9px monospace';
                ctx.fillText(label, x1 + 2, PAD.top + 10);
            });

            // Grid lines
            ctx.strokeStyle = '#1e3a5f';
            ctx.lineWidth = 1;
            const yTicks = 5;
            for (let i = 0; i <= yTicks; i++) {
                const p = pMin + (pRange * i / yTicks);
                const y = py(p);
                ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + CW, y); ctx.stroke();
                ctx.fillStyle = '#4b5563';
                ctx.font = '10px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(p.toFixed(0), PAD.left - 4, y + 3);
            }
            const xTicks = Math.min(8, data.length);
            for (let i = 0; i <= xTicks; i++) {
                const f = fMin + (fRange * i / xTicks);
                const x = fx(f);
                ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, PAD.top + CH); ctx.stroke();
                ctx.fillStyle = '#4b5563';
                ctx.font = '10px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(f.toFixed(0), x, PAD.top + CH + 14);
            }

            // Axis labels
            ctx.fillStyle = '#6b7280';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('MHz', PAD.left + CW / 2, H - 2);
            ctx.save();
            ctx.translate(10, PAD.top + CH / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('dB', 0, 0);
            ctx.restore();

            // Peak reference line
            if (peak) {
                const px2 = fx(peak.freq);
                ctx.strokeStyle = 'rgba(233,69,96,0.7)';
                ctx.setLineDash([4, 3]);
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(px2, PAD.top); ctx.lineTo(px2, PAD.top + CH); ctx.stroke();
                ctx.setLineDash([]);
            }

            // Spectrum fill
            ctx.beginPath();
            ctx.moveTo(fx(freqs[0]), py(powers[0]));
            for (let i = 1; i < data.length; i++) ctx.lineTo(fx(freqs[i]), py(powers[i]));
            ctx.lineTo(fx(freqs[freqs.length - 1]), PAD.top + CH);
            ctx.lineTo(fx(freqs[0]), PAD.top + CH);
            ctx.closePath();
            ctx.fillStyle = 'rgba(0,210,255,0.07)';
            ctx.fill();

            // Spectrum line
            ctx.beginPath();
            ctx.moveTo(fx(freqs[0]), py(powers[0]));
            for (let i = 1; i < data.length; i++) ctx.lineTo(fx(freqs[i]), py(powers[i]));
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function ScannerPage() {
            const [startMhz, setStartMhz] = useState(900);
            const [endMhz,   setEndMhz]   = useState(930);
            const [fine,     setFine]     = useState(false);
            const [scanning, setScanning] = useState(false);
            const [data,     setData]     = useState(null);
            const [error,    setError]    = useState(null);
            const [peak,     setPeak]     = useState(null);
            const [tooltip,  setTooltip]  = useState(null); // {x, y, freq, power}
            const canvasRef = useRef(null);

            function applyPreset(p) {
                setStartMhz(p.start); setEndMhz(p.end);
                setData(null); setPeak(null); setError(null);
            }

            async function runScan() {
                setScanning(true); setError(null); setData(null); setPeak(null);
                try {
                    const res = await fetch('/api/scan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ start_mhz: startMhz, end_mhz: endMhz, fine }),
                    });
                    const json = await res.json();
                    if (json.error) { setError(json.error); return; }
                    if (!json.data?.length) { setError('No data returned.'); return; }
                    setData(json.data);
                    setPeak(json.data.reduce((a, b) => b.power > a.power ? b : a));
                } catch { setError('Scan request failed.'); }
                finally { setScanning(false); }
            }

            useEffect(() => {
                if (canvasRef.current) drawSpectrum(canvasRef.current, data, peak);
            }, [data, peak]);

            function handleMouseMove(e) {
                if (!data || !canvasRef.current) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const W = canvasRef.current.width;
                const PAD_LEFT = 48, PAD_RIGHT = 16;
                const CW = W - PAD_LEFT - PAD_RIGHT;
                const scaleX = W / rect.width;
                const xPx = (e.clientX - rect.left) * scaleX;
                if (xPx < PAD_LEFT || xPx > PAD_LEFT + CW) { setTooltip(null); return; }
                const frac = (xPx - PAD_LEFT) / CW;
                const freqs = data.map(d => d.freq);
                const fMin = freqs[0], fMax = freqs[freqs.length - 1];
                const freq = fMin + frac * (fMax - fMin);
                const nearest = data.reduce((a, b) => Math.abs(b.freq - freq) < Math.abs(a.freq - freq) ? b : a);
                setTooltip({ x: e.clientX - rect.left, freq: nearest.freq, power: nearest.power });
            }

            return (
                <div className="flex flex-col gap-4 max-w-4xl">
                    <div className="rounded-lg p-4 flex flex-col gap-4" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                        <div className="flex flex-wrap gap-2">
                            {SCAN_PRESETS.map(p => (
                                <button key={p.label} onClick={() => applyPreset(p)}
                                    className="text-xs px-3 py-1.5 rounded transition-colors"
                                    style={{ background: startMhz===p.start&&endMhz===p.end?'#00d2ff':'#0f3460', color: startMhz===p.start&&endMhz===p.end?'#0f3460':'#94a3b8', border:'1px solid #1e3a5f' }}>
                                    {p.label}
                                </button>
                            ))}
                        </div>
                        <div className="flex flex-wrap items-center gap-4">
                            <div className="flex items-center gap-2 text-sm">
                                <label className="text-gray-400">Start</label>
                                <input type="number" value={startMhz} onChange={e=>setStartMhz(Number(e.target.value))}
                                    className="w-24 px-2 py-1 rounded text-sm outline-none"
                                    style={{ background:'#0f3460', border:'1px solid #1e3a5f', color:'#e2e8f0', fontFamily:'monospace' }} />
                                <span className="text-gray-500">MHz</span>
                            </div>
                            <div className="flex items-center gap-2 text-sm">
                                <label className="text-gray-400">End</label>
                                <input type="number" value={endMhz} onChange={e=>setEndMhz(Number(e.target.value))}
                                    className="w-24 px-2 py-1 rounded text-sm outline-none"
                                    style={{ background:'#0f3460', border:'1px solid #1e3a5f', color:'#e2e8f0', fontFamily:'monospace' }} />
                                <span className="text-gray-500">MHz</span>
                            </div>
                            <label className="flex items-center gap-2 text-sm text-gray-400 cursor-pointer select-none">
                                <input type="checkbox" checked={fine} onChange={e=>setFine(e.target.checked)} style={{ accentColor:'#00d2ff' }} />
                                Fine (100 kHz bins)
                            </label>
                            <button onClick={runScan} disabled={scanning} className="px-5 py-1.5 rounded text-sm font-semibold transition-colors ml-auto"
                                style={{ background:scanning?'#1e3a5f':'#00d2ff', color:scanning?'#4a6a8f':'#0f3460', cursor:scanning?'not-allowed':'pointer' }}>
                                {scanning ? 'Scanning…' : 'Scan'}
                            </button>
                        </div>
                    </div>

                    {error && (
                        <div className="text-sm px-4 py-2 rounded" style={{ background:'#2a1e2e', color:'#e94560', border:'1px solid #e9456044' }}>⚠ {error}</div>
                    )}
                    {scanning && (
                        <div className="text-sm text-gray-500 text-center py-8">Sweeping {startMhz}–{endMhz} MHz…</div>
                    )}

                    {peak && (
                        <div className="text-xs px-4 py-2 rounded flex gap-6" style={{ background:'#16213e', border:'1px solid #1e3a5f' }}>
                            <span className="text-gray-500">Peak</span>
                            <span style={{ color:'#00d2ff', fontFamily:'monospace' }}>{peak.freq.toFixed(3)} MHz</span>
                            <span style={{ color:'#e94560', fontFamily:'monospace' }}>{peak.power.toFixed(1)} dB</span>
                        </div>
                    )}

                    {data && (
                        <div className="rounded-lg p-3 flex flex-col gap-1" style={{ background:'#16213e', border:'1px solid #1e3a5f' }}>
                            <div className="relative">
                                <canvas ref={canvasRef} width={860} height={260}
                                    className="w-full rounded" style={{ cursor:'crosshair' }}
                                    onMouseMove={handleMouseMove} onMouseLeave={() => setTooltip(null)} />
                                {tooltip && (
                                    <div className="absolute top-2 pointer-events-none px-2 py-1 rounded text-xs"
                                        style={{ left: Math.min(tooltip.x + 10, 700), background:'#0f3460', border:'1px solid #1e3a5f', fontFamily:'monospace', color:'#e2e8f0' }}>
                                        {tooltip.freq.toFixed(3)} MHz · {tooltip.power.toFixed(1)} dB
                                    </div>
                                )}
                            </div>
                            <div className="flex gap-4 text-xs" style={{ color:'#4b5563' }}>
                                <span><span style={{color:'rgba(0,210,255,0.4)'}}>█</span> FM</span>
                                <span><span style={{color:'rgba(34,197,94,0.4)'}}>█</span> ISM</span>
                                <span><span style={{color:'rgba(168,85,247,0.4)'}}>█</span> Cell</span>
                                <span><span style={{color:'rgba(245,158,11,0.4)'}}>█</span> WiFi</span>
                                <span><span style={{color:'rgba(233,69,96,0.7)'}}>╌</span> Peak</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        // ═══════════════════════════════════════════════════════
        // PHASE 5: ADS-B AIRCRAFT TRACKER
        // ═══════════════════════════════════════════════════════

        const FLL_CENTER = [26.35, -80.08];  // Boca Raton default view
        const DURATION_OPTIONS = [15, 30, 60, 120];

        function AdsbPage() {
            const [duration,  setDuration]  = useState(30);
            const [tracking,  setTracking]  = useState(false);
            const [phase,     setPhase]     = useState(null);   // 'capturing' | 'decoding' | 'done'
            const [aircraft,  setAircraft]  = useState([]);
            const [stats,     setStats]     = useState(null);
            const [error,     setError]     = useState(null);
            const wsRef  = useRef(null);
            const mapRef = useRef(null);       // Leaflet map instance
            const markersRef = useRef({});     // icao -> L.circleMarker

            // Init Leaflet map once
            useEffect(() => {
                if (mapRef.current) return;
                const map = L.map('adsb-map', { center: FLL_CENTER, zoom: 10 });
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 18,
                }).addTo(map);
                mapRef.current = map;
                // Fix Leaflet sizing when tab becomes visible
                setTimeout(() => map.invalidateSize(), 100);
            }, []);

            // Cleanup WS on unmount
            useEffect(() => () => wsRef.current?.close(), []);

            function plotAircraft(list) {
                const map = mapRef.current;
                if (!map) return;

                // Remove stale markers
                const newIcaos = new Set(list.map(a => a.icao));
                Object.keys(markersRef.current).forEach(icao => {
                    if (!newIcaos.has(icao)) {
                        markersRef.current[icao].remove();
                        delete markersRef.current[icao];
                    }
                });

                const bounds = [];
                list.forEach(ac => {
                    if (ac.lat == null || ac.lon == null) return;
                    bounds.push([ac.lat, ac.lon]);
                    const label = ac.callsign || ac.icao;
                    const popupHtml = `
                        <div style="font-family:monospace;font-size:12px;line-height:1.6">
                            <b>${ac.icao}</b>${ac.callsign ? ' — ' + ac.callsign : ''}<br/>
                            ${ac.alt != null ? 'Alt: ' + ac.alt.toLocaleString() + ' ft<br/>' : ''}
                            ${ac.speed != null ? 'Speed: ' + Math.round(ac.speed) + ' kt<br/>' : ''}
                            ${ac.heading != null ? 'Hdg: ' + Math.round(ac.heading) + '°<br/>' : ''}
                            Pos: ${ac.lat.toFixed(4)}, ${ac.lon.toFixed(4)}
                        </div>`;

                    if (markersRef.current[ac.icao]) {
                        markersRef.current[ac.icao]
                            .setLatLng([ac.lat, ac.lon])
                            .setPopupContent(popupHtml);
                    } else {
                        const m = L.circleMarker([ac.lat, ac.lon], {
                            radius: 7,
                            color: '#00d2ff',
                            fillColor: '#0f3460',
                            fillOpacity: 0.9,
                            weight: 2,
                        }).bindPopup(popupHtml)
                          .bindTooltip(label, { permanent: true, direction: 'top',
                              className: 'adsb-label',
                              offset: [0, -10] })
                          .addTo(map);
                        markersRef.current[ac.icao] = m;
                    }
                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
                }
            }

            function startTracking() {
                if (wsRef.current) return;
                setTracking(true);
                setPhase('connecting');
                setError(null);
                setAircraft([]);
                setStats(null);

                const ws = new WebSocket(`ws://${location.host}/ws/adsb`);
                wsRef.current = ws;

                ws.onopen = () => {
                    ws.send(JSON.stringify({ duration }));
                    setPhase('capturing');
                };

                ws.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'status') {
                        setPhase(msg.phase);
                    } else if (msg.type === 'done') {
                        const sorted = [...msg.aircraft].sort((a, b) => (b.alt ?? -1) - (a.alt ?? -1));
                        setAircraft(sorted);
                        setStats({ aircraft: msg.aircraft_count, msgs: msg.msg_count, withPos: msg.with_position });
                        setPhase('done');
                        plotAircraft(sorted);
                    } else if (msg.type === 'error') {
                        setError(msg.message);
                        setPhase(null);
                    }
                };

                ws.onclose = () => {
                    wsRef.current = null;
                    setTracking(false);
                    if (phase !== 'done') setPhase(null);
                };
            }

            function stopTracking() {
                wsRef.current?.close();
            }

            const phaseColors = { capturing: '#f59e0b', decoding: '#00d2ff', done: '#22c55e', connecting: '#6b7280' };
            const phaseLabels = { capturing: `Capturing ${duration}s…`, decoding: 'Decoding…', done: 'Done', connecting: 'Connecting…' };

            return (
                <div className="flex flex-col gap-4" style={{ maxWidth: '900px' }}>

                    {/* Controls */}
                    <div className="rounded-lg p-4 flex flex-wrap items-center gap-4" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                        <div className="flex items-center gap-2 text-sm text-gray-400">
                            Duration:
                            {DURATION_OPTIONS.map(d => (
                                <button key={d}
                                    onClick={() => setDuration(d)}
                                    disabled={tracking}
                                    className="px-2.5 py-1 rounded text-xs transition-colors"
                                    style={{
                                        background: duration === d ? '#00d2ff' : '#0f3460',
                                        color: duration === d ? '#0f3460' : '#94a3b8',
                                        border: '1px solid #1e3a5f',
                                    }}
                                >{d}s</button>
                            ))}
                        </div>
                        <button
                            onClick={tracking ? stopTracking : startTracking}
                            className="px-5 py-1.5 rounded text-sm font-semibold ml-auto transition-colors"
                            style={{
                                background: tracking ? '#4a1e2a' : '#00d2ff',
                                color: tracking ? '#e94560' : '#0f3460',
                                border: tracking ? '1px solid #e94560' : 'none',
                            }}
                        >
                            {tracking ? 'Stop' : 'Start Tracking'}
                        </button>
                    </div>

                    {/* Status bar */}
                    {phase && (
                        <div className="flex items-center gap-3 px-4 py-2 rounded text-sm" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                            <span className="w-2 h-2 rounded-full" style={{ background: phaseColors[phase] ?? '#6b7280',
                                boxShadow: phase !== 'done' ? `0 0 6px ${phaseColors[phase]}` : 'none' }} />
                            <span style={{ color: phaseColors[phase] ?? '#6b7280' }}>{phaseLabels[phase] ?? phase}</span>
                            {stats && (
                                <span className="ml-auto text-gray-500 text-xs" style={{ fontFamily: 'monospace' }}>
                                    {stats.aircraft} aircraft · {stats.msgs} msgs · {stats.withPos} with position
                                </span>
                            )}
                        </div>
                    )}

                    {error && (
                        <div className="text-sm px-4 py-2 rounded" style={{ background: '#2a1e2e', color: '#e94560', border: '1px solid #e9456044' }}>
                            ⚠ {error}
                        </div>
                    )}

                    {/* Map */}
                    <div
                        id="adsb-map"
                        className="rounded-lg overflow-hidden"
                        style={{ height: '350px', border: '1px solid #1e3a5f' }}
                    />

                    {/* Aircraft table */}
                    {aircraft.length > 0 && (
                        <div className="rounded-lg overflow-hidden" style={{ border: '1px solid #1e3a5f' }}>
                            <table className="w-full text-xs" style={{ borderCollapse: 'collapse' }}>
                                <thead>
                                    <tr style={{ background: '#0f3460', color: '#94a3b8' }}>
                                        {['ICAO','Callsign','Alt (ft)','Speed (kt)','Hdg','Position'].map(h => (
                                            <th key={h} className="text-left px-3 py-2 font-medium">{h}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {aircraft.map((ac, i) => (
                                        <tr key={ac.icao} style={{ background: i % 2 === 0 ? '#16213e' : '#1a2540', borderTop: '1px solid #1e3a5f' }}>
                                            <td className="px-3 py-1.5 font-bold" style={{ color: '#00d2ff', fontFamily: 'monospace' }}>{ac.icao}</td>
                                            <td className="px-3 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{ac.callsign || '—'}</td>
                                            <td className="px-3 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{ac.alt != null ? ac.alt.toLocaleString() : '—'}</td>
                                            <td className="px-3 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{ac.speed != null ? Math.round(ac.speed) : '—'}</td>
                                            <td className="px-3 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{ac.heading != null ? Math.round(ac.heading) + '°' : '—'}</td>
                                            <td className="px-3 py-1.5 text-gray-400" style={{ fontFamily: 'monospace' }}>
                                                {ac.lat != null ? `${ac.lat.toFixed(3)}, ${ac.lon.toFixed(3)}` : '—'}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }
        // ═══════════════════════════════════════════════════════
        // PHASE 6: FM RADIO
        // ═══════════════════════════════════════════════════════

        const FM_PRESETS = [
            { label: '93.9', freq: 93.9 },
            { label: '96.5', freq: 96.5 },
            { label: '99.9', freq: 99.9 },
            { label: '101.5', freq: 101.5 },
            { label: '104.3', freq: 104.3 },
        ];
        const FM_DURATIONS = [5, 10, 30];

        function FmPage() {
            const [freq,     setFreq]     = useState(93.9);
            const [duration, setDuration] = useState(10);
            const [tuning,   setTuning]   = useState(false);
            const [wavUrl,   setWavUrl]   = useState(null);
            const [error,    setError]    = useState(null);
            const [freqInfo, setFreqInfo] = useState(null);
            const canvasRef  = useRef(null);
            const audioRef   = useRef(null);

            async function handleTune() {
                setTuning(true);
                setError(null);
                setWavUrl(null);
                setFreqInfo(null);
                try {
                    const res = await fetch('/api/fm/tune', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ freq, duration }),
                    });
                    const data = await res.json();
                    if (!data.success) {
                        setError(data.error || 'Tuning failed.');
                    } else {
                        setWavUrl(data.wav_url);
                        setFreqInfo({ freq: data.freq, duration: data.duration });
                    }
                } catch {
                    setError('Request failed.');
                } finally {
                    setTuning(false);
                }
            }

            // Draw waveform on canvas once WAV URL is available
            useEffect(() => {
                if (!wavUrl || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                fetch(wavUrl)
                    .then(r => r.arrayBuffer())
                    .then(buf => new AudioContext().decodeAudioData(buf))
                    .then(audioBuf => {
                        const data = audioBuf.getChannelData(0);
                        const W = canvas.width;
                        const H = canvas.height;
                        const step = Math.ceil(data.length / W);

                        ctx.fillStyle = '#0f3460';
                        ctx.fillRect(0, 0, W, H);

                        ctx.strokeStyle = '#00d2ff';
                        ctx.lineWidth = 1;
                        ctx.beginPath();

                        for (let x = 0; x < W; x++) {
                            let min = 1, max = -1;
                            for (let s = x * step; s < (x + 1) * step && s < data.length; s++) {
                                if (data[s] < min) min = data[s];
                                if (data[s] > max) max = data[s];
                            }
                            const yMin = (1 - (min + 1) / 2) * H;
                            const yMax = (1 - (max + 1) / 2) * H;
                            x === 0 ? ctx.moveTo(x, yMin) : ctx.lineTo(x, yMin);
                            ctx.lineTo(x, yMax);
                        }
                        ctx.stroke();

                        // Center line
                        ctx.strokeStyle = '#1e3a5f';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(0, H / 2);
                        ctx.lineTo(W, H / 2);
                        ctx.stroke();
                    })
                    .catch(() => {/* waveform optional — don't surface errors */});
            }, [wavUrl]);

            return (
                <div className="flex flex-col gap-4" style={{ maxWidth: '600px' }}>

                    {/* Tuner controls */}
                    <div className="rounded-lg p-4 flex flex-col gap-4" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>

                        {/* Preset buttons */}
                        <div className="flex flex-wrap items-center gap-2">
                            <span className="text-xs text-gray-500 mr-1">Presets</span>
                            {FM_PRESETS.map(p => (
                                <button
                                    key={p.freq}
                                    onClick={() => setFreq(p.freq)}
                                    className="text-xs px-2.5 py-1 rounded transition-colors"
                                    style={{
                                        background: freq === p.freq ? '#00d2ff' : '#0f3460',
                                        color: freq === p.freq ? '#0f3460' : '#94a3b8',
                                        border: '1px solid #1e3a5f',
                                    }}
                                >
                                    {p.label}
                                </button>
                            ))}
                        </div>

                        {/* Freq + duration inputs */}
                        <div className="flex flex-wrap items-center gap-4">
                            <div className="flex items-center gap-2 text-sm">
                                <label className="text-gray-400">Freq</label>
                                <input
                                    type="number"
                                    value={freq}
                                    min={88}
                                    max={108}
                                    step={0.1}
                                    onChange={e => setFreq(parseFloat(e.target.value))}
                                    className="w-24 px-2 py-1 rounded text-sm outline-none"
                                    style={{ background: '#0f3460', border: '1px solid #1e3a5f', color: '#e2e8f0', fontFamily: 'monospace' }}
                                />
                                <span className="text-gray-500">MHz</span>
                            </div>
                            <div className="flex items-center gap-2 text-sm text-gray-400">
                                Duration:
                                {FM_DURATIONS.map(d => (
                                    <button
                                        key={d}
                                        onClick={() => setDuration(d)}
                                        className="px-2.5 py-1 rounded text-xs transition-colors"
                                        style={{
                                            background: duration === d ? '#00d2ff' : '#0f3460',
                                            color: duration === d ? '#0f3460' : '#94a3b8',
                                            border: '1px solid #1e3a5f',
                                        }}
                                    >{d}s</button>
                                ))}
                            </div>
                        </div>

                        <button
                            onClick={handleTune}
                            disabled={tuning}
                            className="px-5 py-2 rounded text-sm font-semibold self-start transition-colors"
                            style={{
                                background: tuning ? '#1e3a5f' : '#00d2ff',
                                color: tuning ? '#4a6a8f' : '#0f3460',
                                cursor: tuning ? 'not-allowed' : 'pointer',
                            }}
                        >
                            {tuning ? `Capturing ${duration}s…` : `Tune ${freq} MHz`}
                        </button>
                    </div>

                    {/* Error */}
                    {error && (
                        <div className="text-sm px-4 py-2 rounded" style={{ background: '#2a1e2e', color: '#e94560', border: '1px solid #e9456044' }}>
                            ⚠ {error}
                        </div>
                    )}

                    {/* Player + waveform */}
                    {wavUrl && (
                        <div className="rounded-lg p-4 flex flex-col gap-3" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                            {freqInfo && (
                                <div className="text-xs text-gray-400" style={{ fontFamily: 'monospace' }}>
                                    {freqInfo.freq} MHz · {freqInfo.duration}s capture
                                </div>
                            )}

                            {/* Waveform canvas */}
                            <canvas
                                ref={canvasRef}
                                width={560}
                                height={80}
                                className="rounded w-full"
                                style={{ border: '1px solid #1e3a5f' }}
                            />

                            {/* HTML5 audio player */}
                            <audio
                                ref={audioRef}
                                controls
                                src={wavUrl}
                                style={{ width: '100%', accentColor: '#00d2ff' }}
                            />
                        </div>
                    )}
                </div>
            );
        }
        // ═══════════════════════════════════════════════════════
        // PHASE 8: SIGNAL VISUALIZATION
        // ═══════════════════════════════════════════════════════

        function SignalsPage() {
            const [files,     setFiles]     = useState([]);
            const [selected,  setSelected]  = useState('');
            const [loading,   setLoading]   = useState(false);
            const [sigData,   setSigData]   = useState(null);
            const [error,     setError]     = useState(null);
            const canvasRef = useRef(null);

            // Load file list on mount
            useEffect(() => {
                fetch('/api/signals/list')
                    .then(r => r.json())
                    .then(d => {
                        setFiles(d.files || []);
                        if (d.files?.length > 0) setSelected(d.files[0].name);
                    })
                    .catch(() => setError('Could not load file list.'));
            }, []);

            async function loadSignal(name) {
                if (!name) return;
                setLoading(true);
                setError(null);
                setSigData(null);
                try {
                    const res = await fetch(`/api/signals/${encodeURIComponent(name)}?downsample=1200`);
                    const data = await res.json();
                    if (data.error) { setError(data.error); return; }
                    setSigData(data);
                } catch {
                    setError('Failed to load signal data.');
                } finally {
                    setLoading(false);
                }
            }

            // Draw envelope on canvas whenever sigData changes
            useEffect(() => {
                if (!sigData || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const W = canvas.width;
                const H = canvas.height;
                const env = sigData.envelope;
                const max = Math.max(...env) || 1;

                ctx.fillStyle = '#0f1a2e';
                ctx.fillRect(0, 0, W, H);

                // Draw burst regions first (behind the signal)
                sigData.bursts.forEach(b => {
                    const x1 = (b.start / env.length) * W;
                    const x2 = (b.end   / env.length) * W;
                    ctx.fillStyle = '#00d2ff0f';
                    ctx.fillRect(x1, 0, x2 - x1, H);
                });

                // Threshold line
                const threshY = H - (sigData.threshold / max) * H;
                ctx.strokeStyle = '#e9456066';
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, threshY);
                ctx.lineTo(W, threshY);
                ctx.stroke();
                ctx.setLineDash([]);

                // Envelope
                ctx.strokeStyle = '#00d2ff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                env.forEach((v, x) => {
                    const px = (x / env.length) * W;
                    const py = H - (v / max) * H;
                    x === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                });
                ctx.stroke();

                // Fill under the curve
                ctx.lineTo(W, H);
                ctx.lineTo(0, H);
                ctx.closePath();
                ctx.fillStyle = '#00d2ff0a';
                ctx.fill();

            }, [sigData]);

            const selectedMeta = files.find(f => f.name === selected);

            return (
                <div className="flex flex-col gap-4" style={{ maxWidth: '800px' }}>

                    {/* File picker */}
                    <div className="rounded-lg p-4 flex flex-wrap items-center gap-4" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                        <div className="flex items-center gap-3 flex-1">
                            <label className="text-sm text-gray-400 flex-shrink-0">IQ File</label>
                            <select
                                value={selected}
                                onChange={e => setSelected(e.target.value)}
                                className="flex-1 px-3 py-1.5 rounded text-sm outline-none"
                                style={{ background: '#0f3460', border: '1px solid #1e3a5f', color: '#e2e8f0', fontFamily: 'monospace' }}
                            >
                                {files.length === 0 && <option value="">No .iq files found</option>}
                                {files.map(f => (
                                    <option key={f.name} value={f.name}>
                                        {f.name}  ({f.size_mb} MB)
                                    </option>
                                ))}
                            </select>
                        </div>
                        <button
                            onClick={() => loadSignal(selected)}
                            disabled={loading || !selected}
                            className="px-5 py-1.5 rounded text-sm font-semibold transition-colors"
                            style={{
                                background: loading || !selected ? '#1e3a5f' : '#00d2ff',
                                color: loading || !selected ? '#4a6a8f' : '#0f3460',
                                cursor: loading || !selected ? 'not-allowed' : 'pointer',
                            }}
                        >
                            {loading ? 'Loading…' : 'View'}
                        </button>
                    </div>

                    {error && (
                        <div className="text-sm px-4 py-2 rounded" style={{ background: '#2a1e2e', color: '#e94560', border: '1px solid #e9456044' }}>
                            ⚠ {error}
                        </div>
                    )}

                    {/* Metadata bar */}
                    {sigData && (
                        <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
                            {[
                                { label: 'Samples',     value: sigData.samples.toLocaleString() },
                                { label: 'Duration',    value: `${sigData.duration_s} s` },
                                { label: 'Sample Rate', value: `${(sigData.sample_rate / 1e6).toFixed(0)} MS/s` },
                                { label: 'Bursts',      value: sigData.bursts.length },
                            ].map(({ label, value }) => (
                                <div key={label} className="rounded px-3 py-2 text-xs" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                                    <div className="text-gray-500 mb-0.5">{label}</div>
                                    <div className="text-gray-200" style={{ fontFamily: 'monospace' }}>{value}</div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Envelope canvas */}
                    {sigData && (
                        <div className="rounded-lg p-3 flex flex-col gap-2" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                            <div className="flex items-center justify-between text-xs text-gray-500">
                                <span>Envelope — {selected}</span>
                                <span>
                                    <span style={{ color: '#00d2ff' }}>━</span> signal &nbsp;
                                    <span style={{ color: '#00d2ff', opacity: 0.3 }}>█</span> burst &nbsp;
                                    <span style={{ color: '#e94560', opacity: 0.5 }}>╌</span> threshold
                                </span>
                            </div>
                            <canvas
                                ref={canvasRef}
                                width={760}
                                height={160}
                                className="rounded w-full"
                                style={{ border: '1px solid #1e3a5f' }}
                            />
                            <div className="flex justify-between text-xs text-gray-600" style={{ fontFamily: 'monospace' }}>
                                <span>0 s</span>
                                <span>{(sigData.duration_s / 2).toFixed(2)} s</span>
                                <span>{sigData.duration_s} s</span>
                            </div>
                        </div>
                    )}

                    {/* Burst table */}
                    {sigData && sigData.bursts.length > 0 && (
                        <div className="rounded-lg overflow-hidden" style={{ border: '1px solid #1e3a5f' }}>
                            <div className="px-4 py-2 text-xs font-semibold tracking-widest text-gray-500 uppercase" style={{ background: '#0f3460' }}>
                                Detected Bursts
                            </div>
                            <table className="w-full text-xs" style={{ borderCollapse: 'collapse' }}>
                                <thead>
                                    <tr style={{ background: '#0f3460', color: '#94a3b8' }}>
                                        <th className="text-left px-4 py-1.5 font-medium">#</th>
                                        <th className="text-left px-4 py-1.5 font-medium">Start</th>
                                        <th className="text-left px-4 py-1.5 font-medium">End</th>
                                        <th className="text-left px-4 py-1.5 font-medium">Width (samples)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {sigData.bursts.slice(0, 20).map((b, i) => {
                                        const samplesPerPoint = sigData.samples / sigData.envelope.length;
                                        const toTime = idx => ((idx * samplesPerPoint) / sigData.sample_rate).toFixed(4);
                                        return (
                                            <tr key={i} style={{ background: i % 2 === 0 ? '#16213e' : '#1a2540', borderTop: '1px solid #1e3a5f' }}>
                                                <td className="px-4 py-1.5 text-gray-500" style={{ fontFamily: 'monospace' }}>{i + 1}</td>
                                                <td className="px-4 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{toTime(b.start)} s</td>
                                                <td className="px-4 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{toTime(b.end)} s</td>
                                                <td className="px-4 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{Math.round((b.end - b.start) * samplesPerPoint).toLocaleString()}</td>
                                            </tr>
                                        );
                                    })}
                                    {sigData.bursts.length > 20 && (
                                        <tr style={{ background: '#16213e', borderTop: '1px solid #1e3a5f' }}>
                                            <td colSpan={4} className="px-4 py-1.5 text-gray-600 text-center">
                                                …and {sigData.bursts.length - 20} more
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* inspectrum hint */}
                    {selected && (
                        <div className="text-xs px-4 py-2 rounded" style={{ background: '#16213e', border: '1px solid #1e3a5f', color: '#4a6a8f', fontFamily: 'monospace' }}>
                            $ inspectrum ~/Projects/HackRFComms/iq_dumps/{selected}
                        </div>
                    )}
                </div>
            );
        }
        // ═══════════════════════════════════════════════════════
        // PHASE 7: FLIPPER ZERO PANEL
        // ═══════════════════════════════════════════════════════

        function FlipperPage() {
            // Encode state
            const [encMsg,       setEncMsg]       = useState('');
            const [encoding,     setEncoding]      = useState(false);
            const [encResult,    setEncResult]     = useState(null);
            const [encError,     setEncError]      = useState(null);

            // Decode state
            const [decoding,     setDecoding]      = useState(false);
            const [decResult,    setDecResult]     = useState(null);
            const [decError,     setDecError]      = useState(null);
            const [dragOver,     setDragOver]      = useState(false);
            const fileInputRef = useRef(null);

            async function handleEncode() {
                if (!encMsg.trim()) return;
                setEncoding(true);
                setEncError(null);
                setEncResult(null);
                try {
                    const res = await fetch('/api/flipper/encode', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: encMsg }),
                    });
                    const data = await res.json();
                    if (!data.success) {
                        setEncError(data.error || 'Encode failed.');
                    } else {
                        setEncResult(data);
                    }
                } catch {
                    setEncError('Request failed.');
                } finally {
                    setEncoding(false);
                }
            }

            async function handleDecodeFile(file) {
                if (!file || !file.name.endsWith('.sub')) {
                    setDecError('Please upload a .sub file.');
                    return;
                }
                setDecoding(true);
                setDecError(null);
                setDecResult(null);
                const form = new FormData();
                form.append('file', file);
                try {
                    const res = await fetch('/api/flipper/decode', { method: 'POST', body: form });
                    const data = await res.json();
                    if (data.error) {
                        setDecError(data.error);
                    } else {
                        setDecResult(data);
                    }
                } catch {
                    setDecError('Request failed.');
                } finally {
                    setDecoding(false);
                }
            }

            function onFileChange(e) {
                const file = e.target.files?.[0];
                if (file) handleDecodeFile(file);
            }

            function onDrop(e) {
                e.preventDefault();
                setDragOver(false);
                const file = e.dataTransfer.files?.[0];
                if (file) handleDecodeFile(file);
            }

            return (
                <div className="flex flex-col gap-6" style={{ maxWidth: '640px' }}>

                    {/* ── Encode section ── */}
                    <div className="rounded-lg p-4 flex flex-col gap-3" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                        <h2 className="text-xs font-semibold tracking-widest text-gray-500 uppercase">Encode → .sub</h2>

                        <div className="flex gap-2">
                            <input
                                type="text"
                                value={encMsg}
                                onChange={e => setEncMsg(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleEncode()}
                                placeholder="Message to transmit…"
                                className="flex-1 px-3 py-2 rounded text-sm outline-none"
                                style={{ background: '#0f3460', border: '1px solid #1e3a5f', color: '#e2e8f0', fontFamily: 'monospace' }}
                            />
                            <button
                                onClick={handleEncode}
                                disabled={encoding || !encMsg.trim()}
                                className="px-4 py-2 rounded text-sm font-semibold transition-colors"
                                style={{
                                    background: encoding || !encMsg.trim() ? '#1e3a5f' : '#00d2ff',
                                    color: encoding || !encMsg.trim() ? '#4a6a8f' : '#0f3460',
                                    cursor: encoding || !encMsg.trim() ? 'not-allowed' : 'pointer',
                                }}
                            >
                                {encoding ? 'Building…' : 'Generate .sub'}
                            </button>
                        </div>

                        {encError && (
                            <div className="text-xs px-3 py-2 rounded" style={{ background: '#2a1e2e', color: '#e94560' }}>⚠ {encError}</div>
                        )}

                        {encResult && (
                            <div className="flex flex-col gap-2">
                                <div className="grid grid-cols-3 gap-2 text-xs" style={{ fontFamily: 'monospace' }}>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Frame</div>
                                        <div className="text-gray-200">{encResult.frame_bytes} bytes</div>
                                    </div>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Duration</div>
                                        <div className="text-gray-200">{encResult.duration_ms} ms</div>
                                    </div>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Repeats</div>
                                        <div className="text-gray-200">5×</div>
                                    </div>
                                </div>
                                <a
                                    href={encResult.download_url}
                                    download="flipper_tx.sub"
                                    className="inline-flex items-center gap-2 px-4 py-2 rounded text-sm font-semibold self-start"
                                    style={{ background: '#1e4a3f', color: '#22c55e', border: '1px solid #22c55e44' }}
                                >
                                    ↓ Download flipper_tx.sub
                                </a>
                            </div>
                        )}
                    </div>

                    {/* ── Decode section ── */}
                    <div className="rounded-lg p-4 flex flex-col gap-3" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                        <h2 className="text-xs font-semibold tracking-widest text-gray-500 uppercase">Decode .sub → Message</h2>

                        {/* Drop zone */}
                        <div
                            onClick={() => fileInputRef.current?.click()}
                            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                            onDragLeave={() => setDragOver(false)}
                            onDrop={onDrop}
                            className="rounded-lg flex flex-col items-center justify-center gap-2 py-8 cursor-pointer transition-colors text-sm"
                            style={{
                                border: `2px dashed ${dragOver ? '#00d2ff' : '#1e3a5f'}`,
                                background: dragOver ? '#0f1f3a' : '#0f3460',
                                color: dragOver ? '#00d2ff' : '#6b7280',
                            }}
                        >
                            <span className="text-2xl opacity-50">⌨</span>
                            <span>{decoding ? 'Decoding…' : 'Drop a .sub file here or click to upload'}</span>
                        </div>
                        <input ref={fileInputRef} type="file" accept=".sub" onChange={onFileChange} className="hidden" />

                        {decError && (
                            <div className="text-xs px-3 py-2 rounded" style={{ background: '#2a1e2e', color: '#e94560' }}>⚠ {decError}</div>
                        )}

                        {decResult && (
                            <div className="flex flex-col gap-3">
                                {/* Stats */}
                                <div className="grid grid-cols-3 gap-2 text-xs" style={{ fontFamily: 'monospace' }}>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Frequency</div>
                                        <div className="text-gray-200">{decResult.frequency ? (decResult.frequency / 1e6).toFixed(2) + ' MHz' : '—'}</div>
                                    </div>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Durations</div>
                                        <div className="text-gray-200">{decResult.duration_count}</div>
                                    </div>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Bits</div>
                                        <div className="text-gray-200">{decResult.bit_count}</div>
                                    </div>
                                </div>

                                {/* Decoded messages */}
                                {decResult.unique.length > 0 ? (
                                    <div className="flex flex-col gap-1">
                                        <div className="text-xs text-gray-500 mb-1">
                                            {decResult.unique.length} unique message{decResult.unique.length !== 1 ? 's' : ''} ({decResult.messages.length} total)
                                        </div>
                                        {decResult.unique.map((msg, i) => (
                                            <div key={i} className="px-3 py-2 rounded text-sm" style={{ background: '#1e3a2f', color: '#22c55e', fontFamily: 'monospace', border: '1px solid #22c55e22' }}>
                                                {msg}
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-sm text-center py-3" style={{ color: '#e94560' }}>
                                        No messages decoded — CRC/preamble mismatch
                                    </div>
