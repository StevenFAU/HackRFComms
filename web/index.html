                                )}
                            </div>
                        )}
                    </div>

                    {/* ── Instructions ── */}
                    <div className="rounded-lg p-4 text-xs flex flex-col gap-2" style={{ background: '#16213e', border: '1px solid #1e3a5f', color: '#6b7280' }}>
                        <div className="text-gray-400 font-semibold mb-1">Workflow</div>
                        <div>1. Type message → Generate .sub → download file</div>
                        <div>2. Copy flipper_tx.sub to Flipper SD card → Sub-GHz → Saved → Send</div>
                        <div>3. To decode a capture: drop the .sub file in the box above</div>
                        <div className="mt-2 pt-2" style={{ borderTop: '1px solid #1e3a5f', color: '#4a6a8f' }}>
                            Note: CC1101 (Flipper) has a ~35 kHz frequency offset vs HackRF at 915 MHz.
                            Fine-tune on the Flipper if packets are missed.
                        </div>
                    </div>
                </div>
            );
        }

        const PAGES = {
            dashboard: DashboardPage,
            comms:     CommsPage,
            scanner:   ScannerPage,
            adsb:      AdsbPage,
            fm:        FmPage,
            signals:   SignalsPage,
            flipper:   FlipperPage,
        };

        // ── Sidebar ────────────────────────────────────────────
        function Sidebar({ activePage, onNavigate }) {
            return (
                <aside
                    className="flex flex-col w-52 flex-shrink-0 h-screen"
                    style={{ background: '#0f3460', borderRight: '1px solid #1e3a5f' }}
                >
                    {/* Logo */}
                    <div className="px-4 py-5" style={{ borderBottom: '1px solid #1e3a5f' }}>
                        <div className="text-sm font-bold tracking-widest" style={{ color: '#00d2ff' }}>
                            HACKRF
                        </div>
                        <div className="text-xs text-gray-400 tracking-widest">COMMS</div>
                    </div>

                    {/* Nav items */}
                    <nav className="flex-1 py-3 overflow-y-auto">
                        {NAV_ITEMS.map(item => {
                            const active = activePage === item.id;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => onNavigate(item.id)}
                                    className="w-full flex items-center gap-3 px-4 py-2.5 text-sm transition-colors"
                                    style={{
                                        background: active ? '#16213e' : 'transparent',
                                        color: active ? '#00d2ff' : '#94a3b8',
                                        borderLeft: active ? '2px solid #00d2ff' : '2px solid transparent',
                                    }}
                                >
                                    <span className="text-base w-5 text-center opacity-80">{item.icon}</span>
                                    {item.label}
                                </button>
                            );
                        })}
                    </nav>

                    {/* Footer */}
                    <div className="px-4 py-3 text-xs text-gray-600" style={{ borderTop: '1px solid #1e3a5f' }}>
                        web/lightweight
                    </div>
                </aside>
            );
        }

        // ── Header ─────────────────────────────────────────────
        function Header({ activePage, connected }) {
            const item = NAV_ITEMS.find(n => n.id === activePage);
            return (
                <header
                    className="flex items-center justify-between px-6 py-3 flex-shrink-0"
                    style={{ background: '#16213e', borderBottom: '1px solid #1e3a5f' }}
                >
                    <div className="flex items-center gap-3">
                        <span className="text-lg">{item?.icon}</span>
                        <span className="text-sm font-semibold text-gray-200">{item?.label}</span>
                    </div>
                    <div className="flex items-center gap-2 text-xs text-gray-400">
                        <StatusDot connected={connected} />
                        <span>{connected === null ? 'connecting…' : connected ? 'API connected' : 'API offline'}</span>
                    </div>
                </header>
            );
        }

        // ── Layout ─────────────────────────────────────────────
        function Layout({ children, activePage, onNavigate, connected }) {
            return (
                <div className="flex h-screen overflow-hidden" style={{ background: '#1a1a2e' }}>
                    <Sidebar activePage={activePage} onNavigate={onNavigate} />
                    <div className="flex flex-col flex-1 overflow-hidden">
                        <Header activePage={activePage} connected={connected} />
                        <main className="flex-1 overflow-auto p-6">
                            <ErrorBoundary key={activePage}>
                                {children}
                            </ErrorBoundary>
                        </main>
                    </div>
                </div>
            );
        }

        // ── App ────────────────────────────────────────────────
        function App() {
            const [activePage, setActivePage] = useState('dashboard');
            const [connected, setConnected]   = useState(null); // null=checking, true, false

            useEffect(() => {
                fetch('/api/health')
                    .then(r => r.ok ? r.json() : Promise.reject())
                    .then(() => setConnected(true))
                    .catch(() => setConnected(false));
            }, []);

            const PageComponent = PAGES[activePage] || DashboardPage;

            return (
                <Layout activePage={activePage} onNavigate={setActivePage} connected={connected}>
                    <PageComponent />
                </Layout>
            );
        }

        // ═══════════════════════════════════════════════════════
        // MOUNT
        // ═══════════════════════════════════════════════════════
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
