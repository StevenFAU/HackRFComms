<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackRFComms</title>

    <!-- React 18 from CDN -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX transpilation in browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

    <!-- Tailwind CSS from CDN (no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        panel: '#16213e',
                        sidebar: '#0f3460',
                        base: '#1a1a2e',
                        accent: '#00d2ff',
                        alert: '#e94560',
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Leaflet for ADS-B map (Phase 5) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <!-- Recharts for spectrum plots (Phase 4) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>

    <style>
        body { margin: 0; background: #1a1a2e; color: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ═══════════════════════════════════════════════════════
        // PHASE 1: APP SHELL — sidebar, header, routing, health
        // ═══════════════════════════════════════════════════════
        // PHASE 2: DEVICE DASHBOARD
        // ═══════════════════════════════════════════════════════

        const NAV_ITEMS = [
            { id: 'dashboard', label: 'Dashboard',  icon: '⬡' },
            { id: 'comms',     label: 'Comms',      icon: '⇄' },
            { id: 'scanner',   label: 'Scanner',    icon: '⊶' },
            { id: 'adsb',      label: 'ADS-B',      icon: '✈' },
            { id: 'fm',        label: 'FM Radio',   icon: '◉' },
            { id: 'signals',   label: 'Signals',    icon: '∿' },
            { id: 'flipper',   label: 'Flipper',    icon: '⌨' },
        ];

        // ── StatusDot ──────────────────────────────────────────
        function StatusDot({ connected }) {
            return (
                <span
                    title={connected === null ? 'Connecting…' : connected ? 'Connected' : 'Disconnected'}
                    className="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0"
                    style={{
                        background: connected === null ? '#6b7280' : connected ? '#22c55e' : '#e94560',
                        boxShadow: connected ? '0 0 6px #22c55e' : 'none',
                    }}
                />
            );
        }

        // ── Page stubs ─────────────────────────────────────────
        function PageStub({ title, icon, description }) {
            return (
                <div className="flex flex-col items-center justify-center h-full min-h-64 gap-4 text-gray-500">
                    <span className="text-5xl opacity-30">{icon}</span>
                    <div className="text-center">
                        <p className="text-lg font-semibold text-gray-400">{title}</p>
                        <p className="text-sm mt-1">{description || 'Coming in a future phase.'}</p>
                    </div>
                </div>
            );
        }

        // ── DeviceCard ─────────────────────────────────────────
        function DeviceCard({ device }) {
            const isFlipper = device.label === 'Flipper Zero';
            const connected = device.connected;

            let statusColor, statusText;
            if (isFlipper) {
                statusColor = '#6b7280';
                statusText  = 'manual';
            } else if (connected) {
                statusColor = '#22c55e';
                statusText  = 'connected';
            } else {
                statusColor = '#e94560';
                statusText  = 'not found';
            }

            return (
                <div
                    className="rounded-lg p-4 flex flex-col gap-3"
                    style={{ background: '#16213e', border: `1px solid ${connected ? '#1e4a3f' : isFlipper ? '#2a2a4a' : '#4a1e2a'}` }}
                >
                    <div className="flex items-center justify-between">
                        <div>
                            <span className="text-sm font-semibold text-gray-200">{device.label}</span>
                            <span
                                className="ml-2 text-xs px-1.5 py-0.5 rounded"
                                style={{ background: '#0f3460', color: '#00d2ff' }}
                            >
                                {device.role}
                            </span>
                        </div>
                        <div className="flex items-center gap-1.5 text-xs" style={{ color: statusColor }}>
                            <span
                                className="w-2 h-2 rounded-full inline-block"
                                style={{ background: statusColor, boxShadow: connected && !isFlipper ? `0 0 5px ${statusColor}` : 'none' }}
                            />
                            {statusText}
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-xs" style={{ fontFamily: 'monospace' }}>
                        <span className="text-gray-500">Serial</span>
                        <span className="text-gray-300 truncate" title={device.serial}>{device.serial}</span>
                        <span className="text-gray-500">Firmware</span>
                        <span className="text-gray-300">{device.firmware || '—'}</span>
                        <span className="text-gray-500">Hardware</span>
                        <span className="text-gray-300">{device.hardware || '—'}</span>
                    </div>
                </div>
            );
        }

        // ── ProtocolTable ──────────────────────────────────────
        function ProtocolTable({ protocols }) {
            return (
                <div className="rounded-lg overflow-hidden" style={{ border: '1px solid #1e3a5f' }}>
                    <table className="w-full text-xs" style={{ borderCollapse: 'collapse' }}>
                        <thead>
                            <tr style={{ background: '#0f3460', color: '#94a3b8' }}>
                                <th className="text-left px-4 py-2 font-medium">Protocol</th>
                                <th className="text-left px-4 py-2 font-medium">Frequency</th>
                                <th className="text-left px-4 py-2 font-medium">Sample Rate</th>
                                <th className="text-left px-4 py-2 font-medium hidden md:table-cell">Description</th>
                            </tr>
                        </thead>
                        <tbody>
                            {protocols.map((p, i) => (
                                <tr
                                    key={p.name}
                                    style={{
                                        background: i % 2 === 0 ? '#16213e' : '#1a2540',
                                        borderTop: '1px solid #1e3a5f',
                                    }}
                                >
                                    <td className="px-4 py-2 font-semibold" style={{ color: '#00d2ff', fontFamily: 'monospace' }}>
                                        {p.name}
                                    </td>
                                    <td className="px-4 py-2 text-gray-300" style={{ fontFamily: 'monospace' }}>
                                        {p.freq_mhz != null ? `${p.freq_mhz} MHz` : '—'}
                                    </td>
                                    <td className="px-4 py-2 text-gray-300" style={{ fontFamily: 'monospace' }}>
                                        {p.sample_rate_mhz} MS/s
                                    </td>
                                    <td className="px-4 py-2 text-gray-400 hidden md:table-cell">{p.description}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        // ── DashboardPage ──────────────────────────────────────
        function DashboardPage() {
            const [devices, setDevices]     = useState(null);
            const [protocols, setProtocols] = useState(null);
            const [error, setError]         = useState(null);

            const fetchAll = useCallback(() => {
                Promise.all([
                    fetch('/api/devices').then(r => r.json()),
                    fetch('/api/protocols').then(r => r.json()),
                ]).then(([devData, protoData]) => {
                    setDevices(devData.devices);
                    setProtocols(protoData.protocols);
                    setError(null);
                }).catch(() => setError('Failed to load device data.'));
            }, []);

            useEffect(() => {
                fetchAll();
                const id = setInterval(fetchAll, 5000);
                return () => clearInterval(id);
            }, [fetchAll]);

            if (error) {
                return (
                    <div className="flex items-center justify-center h-full text-sm" style={{ color: '#e94560' }}>
                        {error}
                    </div>
                );
            }

            if (!devices || !protocols) {
                return (
                    <div className="flex items-center justify-center h-full text-sm text-gray-500">
                        Loading…
                    </div>
                );
            }

            return (
                <div className="flex flex-col gap-6 max-w-4xl">
                    {/* Device cards */}
                    <div>
                        <h2 className="text-xs font-semibold tracking-widest text-gray-500 uppercase mb-3">Devices</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {devices.map(d => <DeviceCard key={d.serial} device={d} />)}
                        </div>
                    </div>

                    {/* Protocol table */}
                    <div>
                        <h2 className="text-xs font-semibold tracking-widest text-gray-500 uppercase mb-3">Protocols</h2>
                        <ProtocolTable protocols={protocols} />
                    </div>
                </div>
            );
        }
        // ═══════════════════════════════════════════════════════
        // PHASE 3: OOK COMMS PANEL
        // ═══════════════════════════════════════════════════════

        function CommsPage() {
            const [messages, setMessages]   = useState([]);   // {id, dir, text, ts}
            const [input, setInput]         = useState('');
            const [sending, setSending]     = useState(false);
            const [listening, setListening] = useState(false);
            const [wsStatus, setWsStatus]   = useState('idle'); // idle | connecting | open | error
            const wsRef   = useRef(null);
            const logRef  = useRef(null);
            const msgId   = useRef(0);

            // Auto-scroll log on new messages
            useEffect(() => {
                if (logRef.current) {
                    logRef.current.scrollTop = logRef.current.scrollHeight;
                }
            }, [messages]);

            // Cleanup WS on unmount
            useEffect(() => () => wsRef.current?.close(), []);

            function addMsg(dir, text, ts) {
                setMessages(prev => [...prev, { id: msgId.current++, dir, text, ts: ts || new Date().toISOString() }]);
            }

            async function handleSend() {
                const text = input.trim();
                if (!text || sending) return;
                setSending(true);
                addMsg('sent', text);
                setInput('');
                try {
                    const res = await fetch('/api/comms/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text }),
                    });
                    const data = await res.json();
                    if (!data.success) {
                        addMsg('system', data.error || 'Send failed — no ACK received.');
                    }
                } catch {
                    addMsg('system', 'Send request failed.');
                } finally {
                    setSending(false);
                }
            }

            function handleKeyDown(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            }

            function startListening() {
                if (wsRef.current) return;
                setWsStatus('connecting');
                const ws = new WebSocket(`ws://${location.host}/ws/comms`);
                wsRef.current = ws;

                ws.onopen  = () => { setListening(true); setWsStatus('open'); };
                ws.onclose = () => { wsRef.current = null; setListening(false); setWsStatus('idle'); };
                ws.onerror = () => { setWsStatus('error'); };
                ws.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        addMsg('received', msg.data, msg.timestamp);
                    } catch {}
                };
            }

            function stopListening() {
                wsRef.current?.close();
            }

            const wsColors = { idle: '#6b7280', connecting: '#f59e0b', open: '#22c55e', error: '#e94560' };
            const wsLabels = { idle: 'idle', connecting: 'connecting…', open: 'listening', error: 'error' };

            return (
                <div className="flex flex-col gap-4 max-w-2xl h-full" style={{ maxHeight: 'calc(100vh - 120px)' }}>

                    {/* Listen toggle */}
                    <div className="flex items-center justify-between rounded-lg px-4 py-3" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                        <div className="flex items-center gap-2 text-sm">
                            <span
                                className="w-2 h-2 rounded-full"
                                style={{ background: wsColors[wsStatus], boxShadow: wsStatus === 'open' ? `0 0 5px ${wsColors.open}` : 'none' }}
                            />
                            <span className="text-gray-400">RX status:</span>
                            <span style={{ color: wsColors[wsStatus] }}>{wsLabels[wsStatus]}</span>
                        </div>
                        <button
                            onClick={listening ? stopListening : startListening}
                            className="text-xs px-3 py-1.5 rounded font-semibold transition-colors"
                            style={{
                                background: listening ? '#4a1e2a' : '#1e3a5f',
                                color: listening ? '#e94560' : '#00d2ff',
                                border: `1px solid ${listening ? '#e94560' : '#00d2ff'}`,
                            }}
                        >
                            {listening ? 'Stop Listening' : 'Start Listening'}
                        </button>
                    </div>

                    {/* Message log */}
                    <div
                        ref={logRef}
                        className="flex-1 overflow-y-auto rounded-lg p-3 flex flex-col gap-2"
                        style={{ background: '#16213e', border: '1px solid #1e3a5f', minHeight: '200px' }}
                    >
                        {messages.length === 0 && (
                            <div className="flex-1 flex items-center justify-center text-sm text-gray-600">
                                No messages yet.
                            </div>
                        )}
                        {messages.map(m => {
                            const isSent   = m.dir === 'sent';
                            const isSystem = m.dir === 'system';
                            const ts = new Date(m.ts).toLocaleTimeString();

                            if (isSystem) {
                                return (
                                    <div key={m.id} className="text-center text-xs py-1" style={{ color: '#e94560' }}>
                                        ⚠ {m.text}
                                    </div>
                                );
                            }

                            return (
                                <div key={m.id} className={`flex flex-col gap-0.5 ${isSent ? 'items-end' : 'items-start'}`}>
                                    <div
                                        className="px-3 py-2 rounded-lg text-sm max-w-xs break-words"
                                        style={{
                                            background: isSent ? '#1e3a5f' : '#1e3a2f',
                                            color: isSent ? '#00d2ff' : '#22c55e',
                                            fontFamily: 'monospace',
                                        }}
                                    >
                                        {m.text}
                                    </div>
                                    <span className="text-xs text-gray-600">{ts}</span>
                                </div>
                            );
                        })}
                    </div>

                    {/* Input */}
                    <div className="flex gap-2">
                        <input
                            type="text"
                            value={input}
                            onChange={e => setInput(e.target.value)}
                            onKeyDown={handleKeyDown}
                            placeholder="Type a message… (Enter to send)"
                            disabled={sending}
                            className="flex-1 px-3 py-2 rounded text-sm outline-none"
                            style={{
                                background: '#16213e',
                                border: '1px solid #1e3a5f',
                                color: '#e2e8f0',
                                fontFamily: 'monospace',
                                opacity: sending ? 0.6 : 1,
                            }}
                        />
                        <button
                            onClick={handleSend}
                            disabled={sending || !input.trim()}
                            className="px-4 py-2 rounded text-sm font-semibold transition-colors"
                            style={{
                                background: sending || !input.trim() ? '#1e3a5f' : '#00d2ff',
                                color: sending || !input.trim() ? '#4a6a8f' : '#0f3460',
                                cursor: sending || !input.trim() ? 'not-allowed' : 'pointer',
                            }}
                        >
                            {sending ? 'Sending…' : 'Send'}
                        </button>
                    </div>
                </div>
            );
        }
        // ═══════════════════════════════════════════════════════
        // PHASE 4: SPECTRUM SCANNER
        // ═══════════════════════════════════════════════════════

        const SCAN_PRESETS = [
            { label: 'ISM 915',  start: 900,  end: 930  },
            { label: 'FM',       start: 88,   end: 108  },
            { label: 'Wide',     start: 400,  end: 1700 },
            { label: 'Full',     start: 1,    end: 6000 },
        ];

        // Known band shading regions [start_mhz, end_mhz, label, color]
        const KNOWN_BANDS = [
            [88,   108,  'FM',   '#00d2ff22'],
            [433,  435,  'ISM',  '#22c55e22'],
            [902,  928,  'ISM',  '#22c55e22'],
            [2400, 2500, 'WiFi', '#f59e0b22'],
            [5150, 5850, 'WiFi', '#f59e0b22'],
            [700,  900,  'Cell', '#a855f722'],
            [1700, 2200, 'Cell', '#a855f722'],
        ];

        function ScannerPage() {
            const [startMhz, setStartMhz] = useState(900);
            const [endMhz,   setEndMhz]   = useState(930);
            const [fine,     setFine]     = useState(false);
            const [scanning, setScanning] = useState(false);
            const [data,     setData]     = useState(null);   // [{freq, power}]
            const [error,    setError]    = useState(null);
            const [peak,     setPeak]     = useState(null);   // {freq, power}

            const { LineChart, Line, XAxis, YAxis, CartesianGrid,
                    Tooltip, ResponsiveContainer, ReferenceLine,
                    ReferenceArea } = Recharts;

            function applyPreset(p) {
                setStartMhz(p.start);
                setEndMhz(p.end);
                setData(null);
                setPeak(null);
                setError(null);
            }

            async function runScan() {
                setScanning(true);
                setError(null);
                setData(null);
                setPeak(null);
                try {
                    const res = await fetch('/api/scan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ start_mhz: startMhz, end_mhz: endMhz, fine }),
                    });
                    const json = await res.json();
                    if (json.error) { setError(json.error); return; }
                    if (!json.data || json.data.length === 0) { setError('No data returned.'); return; }
                    setData(json.data);
                    const top = json.data.reduce((a, b) => b.power > a.power ? b : a);
                    setPeak(top);
                } catch {
                    setError('Scan request failed.');
                } finally {
                    setScanning(false);
                }
            }

            // Only show bands that overlap the current scan range
            const visibleBands = data ? KNOWN_BANDS.filter(
                ([s, e]) => s < endMhz && e > startMhz
            ) : [];

            return (
                <div className="flex flex-col gap-4 max-w-4xl">

                    {/* Controls */}
                    <div className="rounded-lg p-4 flex flex-col gap-4" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>

                        {/* Preset buttons */}
                        <div className="flex flex-wrap gap-2">
                            {SCAN_PRESETS.map(p => (
                                <button
                                    key={p.label}
                                    onClick={() => applyPreset(p)}
                                    className="text-xs px-3 py-1.5 rounded transition-colors"
                                    style={{
                                        background: startMhz === p.start && endMhz === p.end ? '#00d2ff' : '#0f3460',
                                        color: startMhz === p.start && endMhz === p.end ? '#0f3460' : '#94a3b8',
                                        border: '1px solid #1e3a5f',
                                    }}
                                >
                                    {p.label}
                                </button>
                            ))}
                        </div>

                        {/* Range + options */}
                        <div className="flex flex-wrap items-center gap-4">
                            <div className="flex items-center gap-2 text-sm">
                                <label className="text-gray-400">Start</label>
                                <input
                                    type="number"
                                    value={startMhz}
                                    onChange={e => setStartMhz(Number(e.target.value))}
                                    className="w-24 px-2 py-1 rounded text-sm outline-none"
                                    style={{ background: '#0f3460', border: '1px solid #1e3a5f', color: '#e2e8f0', fontFamily: 'monospace' }}
                                />
                                <span className="text-gray-500">MHz</span>
                            </div>
                            <div className="flex items-center gap-2 text-sm">
                                <label className="text-gray-400">End</label>
                                <input
                                    type="number"
                                    value={endMhz}
                                    onChange={e => setEndMhz(Number(e.target.value))}
                                    className="w-24 px-2 py-1 rounded text-sm outline-none"
                                    style={{ background: '#0f3460', border: '1px solid #1e3a5f', color: '#e2e8f0', fontFamily: 'monospace' }}
                                />
                                <span className="text-gray-500">MHz</span>
                            </div>
                            <label className="flex items-center gap-2 text-sm text-gray-400 cursor-pointer select-none">
                                <input
                                    type="checkbox"
                                    checked={fine}
                                    onChange={e => setFine(e.target.checked)}
                                    style={{ accentColor: '#00d2ff' }}
                                />
                                Fine (100 kHz bins)
                            </label>
                            <button
                                onClick={runScan}
                                disabled={scanning}
                                className="px-5 py-1.5 rounded text-sm font-semibold transition-colors ml-auto"
                                style={{
                                    background: scanning ? '#1e3a5f' : '#00d2ff',
                                    color: scanning ? '#4a6a8f' : '#0f3460',
                                    cursor: scanning ? 'not-allowed' : 'pointer',
                                }}
                            >
                                {scanning ? 'Scanning…' : 'Scan'}
                            </button>
                        </div>
                    </div>

                    {/* Error */}
                    {error && (
                        <div className="text-sm px-4 py-2 rounded" style={{ background: '#2a1e2e', color: '#e94560', border: '1px solid #e9456044' }}>
                            ⚠ {error}
                        </div>
                    )}

                    {/* Loading */}
                    {scanning && (
                        <div className="text-sm text-gray-500 text-center py-8">
                            Sweeping {startMhz}–{endMhz} MHz…
                        </div>
                    )}

                    {/* Peak annotation */}
                    {peak && (
                        <div className="text-xs px-4 py-2 rounded flex gap-6" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                            <span className="text-gray-500">Peak</span>
                            <span style={{ color: '#00d2ff', fontFamily: 'monospace' }}>{peak.freq.toFixed(3)} MHz</span>
                            <span style={{ color: '#e94560', fontFamily: 'monospace' }}>{peak.power.toFixed(1)} dB</span>
                        </div>
                    )}

                    {/* Chart */}
                    {data && (
                        <div className="rounded-lg p-4" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                            <ResponsiveContainer width="100%" height={300}>
                                <LineChart data={data} margin={{ top: 5, right: 20, left: 0, bottom: 5 }}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#1e3a5f" />
                                    <XAxis
                                        dataKey="freq"
                                        tickFormatter={v => `${v.toFixed(0)}`}
                                        tick={{ fill: '#6b7280', fontSize: 11, fontFamily: 'monospace' }}
                                        label={{ value: 'MHz', position: 'insideBottomRight', offset: -5, fill: '#6b7280', fontSize: 11 }}
                                    />
                                    <YAxis
                                        tick={{ fill: '#6b7280', fontSize: 11, fontFamily: 'monospace' }}
                                        label={{ value: 'dB', angle: -90, position: 'insideLeft', fill: '#6b7280', fontSize: 11 }}
                                    />
                                    <Tooltip
                                        contentStyle={{ background: '#0f3460', border: '1px solid #1e3a5f', borderRadius: '6px', fontFamily: 'monospace', fontSize: '12px' }}
                                        labelFormatter={v => `${Number(v).toFixed(3)} MHz`}
                                        formatter={v => [`${Number(v).toFixed(1)} dB`, 'Power']}
                                    />
                                    {visibleBands.map(([s, e, label, color]) => (
                                        <ReferenceArea key={label + s} x1={s} x2={e} fill={color} label={{ value: label, position: 'top', fill: '#6b7280', fontSize: 10 }} />
                                    ))}
                                    {peak && (
                                        <ReferenceLine x={peak.freq} stroke="#e94560" strokeDasharray="4 2" />
                                    )}
                                    <Line
                                        type="monotone"
                                        dataKey="power"
                                        stroke="#00d2ff"
                                        dot={false}
                                        strokeWidth={1.5}
                                        isAnimationActive={false}
                                    />
                                </LineChart>
                            </ResponsiveContainer>
                        </div>
                    )}
                </div>
            );
        }
        // ═══════════════════════════════════════════════════════
        // PHASE 5: ADS-B AIRCRAFT TRACKER
        // ═══════════════════════════════════════════════════════

        const FLL_CENTER = [26.07, -80.15];
        const DURATION_OPTIONS = [15, 30, 60, 120];

        function AdsbPage() {
            const [duration,  setDuration]  = useState(30);
            const [tracking,  setTracking]  = useState(false);
            const [phase,     setPhase]     = useState(null);   // 'capturing' | 'decoding' | 'done'
            const [aircraft,  setAircraft]  = useState([]);
            const [stats,     setStats]     = useState(null);
            const [error,     setError]     = useState(null);
            const wsRef  = useRef(null);
            const mapRef = useRef(null);       // Leaflet map instance
            const markersRef = useRef({});     // icao -> L.circleMarker

            // Init Leaflet map once
            useEffect(() => {
                if (mapRef.current) return;
                const map = L.map('adsb-map', { center: FLL_CENTER, zoom: 10 });
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 18,
                }).addTo(map);
                mapRef.current = map;
                // Fix Leaflet sizing when tab becomes visible
                setTimeout(() => map.invalidateSize(), 100);
            }, []);

            // Cleanup WS on unmount
            useEffect(() => () => wsRef.current?.close(), []);

            function plotAircraft(list) {
                const map = mapRef.current;
                if (!map) return;

                // Remove stale markers
                const newIcaos = new Set(list.map(a => a.icao));
                Object.keys(markersRef.current).forEach(icao => {
                    if (!newIcaos.has(icao)) {
                        markersRef.current[icao].remove();
                        delete markersRef.current[icao];
                    }
                });

                const bounds = [];
                list.forEach(ac => {
                    if (ac.lat == null || ac.lon == null) return;
                    bounds.push([ac.lat, ac.lon]);
                    const label = ac.callsign || ac.icao;
                    const popupHtml = `
                        <div style="font-family:monospace;font-size:12px;line-height:1.6">
                            <b>${ac.icao}</b>${ac.callsign ? ' — ' + ac.callsign : ''}<br/>
                            ${ac.alt != null ? 'Alt: ' + ac.alt.toLocaleString() + ' ft<br/>' : ''}
                            ${ac.speed != null ? 'Speed: ' + Math.round(ac.speed) + ' kt<br/>' : ''}
                            ${ac.heading != null ? 'Hdg: ' + Math.round(ac.heading) + '°<br/>' : ''}
                            Pos: ${ac.lat.toFixed(4)}, ${ac.lon.toFixed(4)}
                        </div>`;

                    if (markersRef.current[ac.icao]) {
                        markersRef.current[ac.icao]
                            .setLatLng([ac.lat, ac.lon])
                            .setPopupContent(popupHtml);
                    } else {
                        const m = L.circleMarker([ac.lat, ac.lon], {
                            radius: 7,
                            color: '#00d2ff',
                            fillColor: '#0f3460',
                            fillOpacity: 0.9,
                            weight: 2,
                        }).bindPopup(popupHtml)
                          .bindTooltip(label, { permanent: true, direction: 'top',
                              className: 'adsb-label',
                              offset: [0, -10] })
                          .addTo(map);
                        markersRef.current[ac.icao] = m;
                    }
                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
                }
            }

            function startTracking() {
                if (wsRef.current) return;
                setTracking(true);
                setPhase('connecting');
                setError(null);
                setAircraft([]);
                setStats(null);

                const ws = new WebSocket(`ws://${location.host}/ws/adsb`);
                wsRef.current = ws;

                ws.onopen = () => {
                    ws.send(JSON.stringify({ duration }));
                    setPhase('capturing');
                };

                ws.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'status') {
                        setPhase(msg.phase);
                    } else if (msg.type === 'done') {
                        const sorted = [...msg.aircraft].sort((a, b) => (b.alt ?? -1) - (a.alt ?? -1));
                        setAircraft(sorted);
                        setStats({ aircraft: msg.aircraft_count, msgs: msg.msg_count, withPos: msg.with_position });
                        setPhase('done');
                        plotAircraft(sorted);
                    } else if (msg.type === 'error') {
                        setError(msg.message);
                        setPhase(null);
                    }
                };

                ws.onclose = () => {
                    wsRef.current = null;
                    setTracking(false);
                    if (phase !== 'done') setPhase(null);
                };
            }

            function stopTracking() {
                wsRef.current?.close();
            }

            const phaseColors = { capturing: '#f59e0b', decoding: '#00d2ff', done: '#22c55e', connecting: '#6b7280' };
            const phaseLabels = { capturing: `Capturing ${duration}s…`, decoding: 'Decoding…', done: 'Done', connecting: 'Connecting…' };

            return (
                <div className="flex flex-col gap-4" style={{ maxWidth: '900px' }}>

                    {/* Controls */}
                    <div className="rounded-lg p-4 flex flex-wrap items-center gap-4" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                        <div className="flex items-center gap-2 text-sm text-gray-400">
                            Duration:
                            {DURATION_OPTIONS.map(d => (
                                <button key={d}
                                    onClick={() => setDuration(d)}
                                    disabled={tracking}
                                    className="px-2.5 py-1 rounded text-xs transition-colors"
                                    style={{
                                        background: duration === d ? '#00d2ff' : '#0f3460',
                                        color: duration === d ? '#0f3460' : '#94a3b8',
                                        border: '1px solid #1e3a5f',
                                    }}
                                >{d}s</button>
                            ))}
                        </div>
                        <button
                            onClick={tracking ? stopTracking : startTracking}
                            className="px-5 py-1.5 rounded text-sm font-semibold ml-auto transition-colors"
                            style={{
                                background: tracking ? '#4a1e2a' : '#00d2ff',
                                color: tracking ? '#e94560' : '#0f3460',
                                border: tracking ? '1px solid #e94560' : 'none',
                            }}
                        >
                            {tracking ? 'Stop' : 'Start Tracking'}
                        </button>
                    </div>

                    {/* Status bar */}
                    {phase && (
                        <div className="flex items-center gap-3 px-4 py-2 rounded text-sm" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                            <span className="w-2 h-2 rounded-full" style={{ background: phaseColors[phase] ?? '#6b7280',
                                boxShadow: phase !== 'done' ? `0 0 6px ${phaseColors[phase]}` : 'none' }} />
                            <span style={{ color: phaseColors[phase] ?? '#6b7280' }}>{phaseLabels[phase] ?? phase}</span>
                            {stats && (
                                <span className="ml-auto text-gray-500 text-xs" style={{ fontFamily: 'monospace' }}>
                                    {stats.aircraft} aircraft · {stats.msgs} msgs · {stats.withPos} with position
                                </span>
                            )}
                        </div>
                    )}

                    {error && (
                        <div className="text-sm px-4 py-2 rounded" style={{ background: '#2a1e2e', color: '#e94560', border: '1px solid #e9456044' }}>
                            ⚠ {error}
                        </div>
                    )}

                    {/* Map */}
                    <div
                        id="adsb-map"
                        className="rounded-lg overflow-hidden"
                        style={{ height: '350px', border: '1px solid #1e3a5f' }}
                    />

                    {/* Aircraft table */}
                    {aircraft.length > 0 && (
                        <div className="rounded-lg overflow-hidden" style={{ border: '1px solid #1e3a5f' }}>
                            <table className="w-full text-xs" style={{ borderCollapse: 'collapse' }}>
                                <thead>
                                    <tr style={{ background: '#0f3460', color: '#94a3b8' }}>
                                        {['ICAO','Callsign','Alt (ft)','Speed (kt)','Hdg','Position'].map(h => (
                                            <th key={h} className="text-left px-3 py-2 font-medium">{h}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {aircraft.map((ac, i) => (
                                        <tr key={ac.icao} style={{ background: i % 2 === 0 ? '#16213e' : '#1a2540', borderTop: '1px solid #1e3a5f' }}>
                                            <td className="px-3 py-1.5 font-bold" style={{ color: '#00d2ff', fontFamily: 'monospace' }}>{ac.icao}</td>
                                            <td className="px-3 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{ac.callsign || '—'}</td>
                                            <td className="px-3 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{ac.alt != null ? ac.alt.toLocaleString() : '—'}</td>
                                            <td className="px-3 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{ac.speed != null ? Math.round(ac.speed) : '—'}</td>
                                            <td className="px-3 py-1.5 text-gray-300" style={{ fontFamily: 'monospace' }}>{ac.heading != null ? Math.round(ac.heading) + '°' : '—'}</td>
                                            <td className="px-3 py-1.5 text-gray-400" style={{ fontFamily: 'monospace' }}>
                                                {ac.lat != null ? `${ac.lat.toFixed(3)}, ${ac.lon.toFixed(3)}` : '—'}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }
        // ═══════════════════════════════════════════════════════
        // PHASE 6: FM RADIO
        // ═══════════════════════════════════════════════════════

        const FM_PRESETS = [
            { label: '93.9', freq: 93.9 },
            { label: '96.5', freq: 96.5 },
            { label: '99.9', freq: 99.9 },
            { label: '101.5', freq: 101.5 },
            { label: '104.3', freq: 104.3 },
        ];
        const FM_DURATIONS = [5, 10, 30];

        function FmPage() {
            const [freq,     setFreq]     = useState(93.9);
            const [duration, setDuration] = useState(10);
            const [tuning,   setTuning]   = useState(false);
            const [wavUrl,   setWavUrl]   = useState(null);
            const [error,    setError]    = useState(null);
            const [freqInfo, setFreqInfo] = useState(null);
            const canvasRef  = useRef(null);
            const audioRef   = useRef(null);

            async function handleTune() {
                setTuning(true);
                setError(null);
                setWavUrl(null);
                setFreqInfo(null);
                try {
                    const res = await fetch('/api/fm/tune', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ freq, duration }),
                    });
                    const data = await res.json();
                    if (!data.success) {
                        setError(data.error || 'Tuning failed.');
                    } else {
                        setWavUrl(data.wav_url);
                        setFreqInfo({ freq: data.freq, duration: data.duration });
                    }
                } catch {
                    setError('Request failed.');
                } finally {
                    setTuning(false);
                }
            }

            // Draw waveform on canvas once WAV URL is available
            useEffect(() => {
                if (!wavUrl || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                fetch(wavUrl)
                    .then(r => r.arrayBuffer())
                    .then(buf => new AudioContext().decodeAudioData(buf))
                    .then(audioBuf => {
                        const data = audioBuf.getChannelData(0);
                        const W = canvas.width;
                        const H = canvas.height;
                        const step = Math.ceil(data.length / W);

                        ctx.fillStyle = '#0f3460';
                        ctx.fillRect(0, 0, W, H);

                        ctx.strokeStyle = '#00d2ff';
                        ctx.lineWidth = 1;
                        ctx.beginPath();

                        for (let x = 0; x < W; x++) {
                            let min = 1, max = -1;
                            for (let s = x * step; s < (x + 1) * step && s < data.length; s++) {
                                if (data[s] < min) min = data[s];
                                if (data[s] > max) max = data[s];
                            }
                            const yMin = (1 - (min + 1) / 2) * H;
                            const yMax = (1 - (max + 1) / 2) * H;
                            x === 0 ? ctx.moveTo(x, yMin) : ctx.lineTo(x, yMin);
                            ctx.lineTo(x, yMax);
                        }
                        ctx.stroke();

                        // Center line
                        ctx.strokeStyle = '#1e3a5f';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(0, H / 2);
                        ctx.lineTo(W, H / 2);
                        ctx.stroke();
                    })
                    .catch(() => {/* waveform optional — don't surface errors */});
            }, [wavUrl]);

            return (
                <div className="flex flex-col gap-4" style={{ maxWidth: '600px' }}>

                    {/* Tuner controls */}
                    <div className="rounded-lg p-4 flex flex-col gap-4" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>

                        {/* Preset buttons */}
                        <div className="flex flex-wrap items-center gap-2">
                            <span className="text-xs text-gray-500 mr-1">Presets</span>
                            {FM_PRESETS.map(p => (
                                <button
                                    key={p.freq}
                                    onClick={() => setFreq(p.freq)}
                                    className="text-xs px-2.5 py-1 rounded transition-colors"
                                    style={{
                                        background: freq === p.freq ? '#00d2ff' : '#0f3460',
                                        color: freq === p.freq ? '#0f3460' : '#94a3b8',
                                        border: '1px solid #1e3a5f',
                                    }}
                                >
                                    {p.label}
                                </button>
                            ))}
                        </div>

                        {/* Freq + duration inputs */}
                        <div className="flex flex-wrap items-center gap-4">
                            <div className="flex items-center gap-2 text-sm">
                                <label className="text-gray-400">Freq</label>
                                <input
                                    type="number"
                                    value={freq}
                                    min={88}
                                    max={108}
                                    step={0.1}
                                    onChange={e => setFreq(parseFloat(e.target.value))}
                                    className="w-24 px-2 py-1 rounded text-sm outline-none"
                                    style={{ background: '#0f3460', border: '1px solid #1e3a5f', color: '#e2e8f0', fontFamily: 'monospace' }}
                                />
                                <span className="text-gray-500">MHz</span>
                            </div>
                            <div className="flex items-center gap-2 text-sm text-gray-400">
                                Duration:
                                {FM_DURATIONS.map(d => (
                                    <button
                                        key={d}
                                        onClick={() => setDuration(d)}
                                        className="px-2.5 py-1 rounded text-xs transition-colors"
                                        style={{
                                            background: duration === d ? '#00d2ff' : '#0f3460',
                                            color: duration === d ? '#0f3460' : '#94a3b8',
                                            border: '1px solid #1e3a5f',
                                        }}
                                    >{d}s</button>
                                ))}
                            </div>
                        </div>

                        <button
                            onClick={handleTune}
                            disabled={tuning}
                            className="px-5 py-2 rounded text-sm font-semibold self-start transition-colors"
                            style={{
                                background: tuning ? '#1e3a5f' : '#00d2ff',
                                color: tuning ? '#4a6a8f' : '#0f3460',
                                cursor: tuning ? 'not-allowed' : 'pointer',
                            }}
                        >
                            {tuning ? `Capturing ${duration}s…` : `Tune ${freq} MHz`}
                        </button>
                    </div>

                    {/* Error */}
                    {error && (
                        <div className="text-sm px-4 py-2 rounded" style={{ background: '#2a1e2e', color: '#e94560', border: '1px solid #e9456044' }}>
                            ⚠ {error}
                        </div>
                    )}

                    {/* Player + waveform */}
                    {wavUrl && (
                        <div className="rounded-lg p-4 flex flex-col gap-3" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                            {freqInfo && (
                                <div className="text-xs text-gray-400" style={{ fontFamily: 'monospace' }}>
                                    {freqInfo.freq} MHz · {freqInfo.duration}s capture
                                </div>
                            )}

                            {/* Waveform canvas */}
                            <canvas
                                ref={canvasRef}
                                width={560}
                                height={80}
                                className="rounded w-full"
                                style={{ border: '1px solid #1e3a5f' }}
                            />

                            {/* HTML5 audio player */}
                            <audio
                                ref={audioRef}
                                controls
                                src={wavUrl}
                                style={{ width: '100%', accentColor: '#00d2ff' }}
                            />
                        </div>
                    )}
                </div>
            );
        }
        function SignalsPage()    { return <PageStub title="Signals"    icon="∿" description="IQ capture envelope viewer — Phase 8." />; }
        // ═══════════════════════════════════════════════════════
        // PHASE 7: FLIPPER ZERO PANEL
        // ═══════════════════════════════════════════════════════

        function FlipperPage() {
            // Encode state
            const [encMsg,       setEncMsg]       = useState('');
            const [encoding,     setEncoding]      = useState(false);
            const [encResult,    setEncResult]     = useState(null);
            const [encError,     setEncError]      = useState(null);

            // Decode state
            const [decoding,     setDecoding]      = useState(false);
            const [decResult,    setDecResult]     = useState(null);
            const [decError,     setDecError]      = useState(null);
            const [dragOver,     setDragOver]      = useState(false);
            const fileInputRef = useRef(null);

            async function handleEncode() {
                if (!encMsg.trim()) return;
                setEncoding(true);
                setEncError(null);
                setEncResult(null);
                try {
                    const res = await fetch('/api/flipper/encode', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: encMsg }),
                    });
                    const data = await res.json();
                    if (!data.success) {
                        setEncError(data.error || 'Encode failed.');
                    } else {
                        setEncResult(data);
                    }
                } catch {
                    setEncError('Request failed.');
                } finally {
                    setEncoding(false);
                }
            }

            async function handleDecodeFile(file) {
                if (!file || !file.name.endsWith('.sub')) {
                    setDecError('Please upload a .sub file.');
                    return;
                }
                setDecoding(true);
                setDecError(null);
                setDecResult(null);
                const form = new FormData();
                form.append('file', file);
                try {
                    const res = await fetch('/api/flipper/decode', { method: 'POST', body: form });
                    const data = await res.json();
                    if (data.error) {
                        setDecError(data.error);
                    } else {
                        setDecResult(data);
                    }
                } catch {
                    setDecError('Request failed.');
                } finally {
                    setDecoding(false);
                }
            }

            function onFileChange(e) {
                const file = e.target.files?.[0];
                if (file) handleDecodeFile(file);
            }

            function onDrop(e) {
                e.preventDefault();
                setDragOver(false);
                const file = e.dataTransfer.files?.[0];
                if (file) handleDecodeFile(file);
            }

            return (
                <div className="flex flex-col gap-6" style={{ maxWidth: '640px' }}>

                    {/* ── Encode section ── */}
                    <div className="rounded-lg p-4 flex flex-col gap-3" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                        <h2 className="text-xs font-semibold tracking-widest text-gray-500 uppercase">Encode → .sub</h2>

                        <div className="flex gap-2">
                            <input
                                type="text"
                                value={encMsg}
                                onChange={e => setEncMsg(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleEncode()}
                                placeholder="Message to transmit…"
                                className="flex-1 px-3 py-2 rounded text-sm outline-none"
                                style={{ background: '#0f3460', border: '1px solid #1e3a5f', color: '#e2e8f0', fontFamily: 'monospace' }}
                            />
                            <button
                                onClick={handleEncode}
                                disabled={encoding || !encMsg.trim()}
                                className="px-4 py-2 rounded text-sm font-semibold transition-colors"
                                style={{
                                    background: encoding || !encMsg.trim() ? '#1e3a5f' : '#00d2ff',
                                    color: encoding || !encMsg.trim() ? '#4a6a8f' : '#0f3460',
                                    cursor: encoding || !encMsg.trim() ? 'not-allowed' : 'pointer',
                                }}
                            >
                                {encoding ? 'Building…' : 'Generate .sub'}
                            </button>
                        </div>

                        {encError && (
                            <div className="text-xs px-3 py-2 rounded" style={{ background: '#2a1e2e', color: '#e94560' }}>⚠ {encError}</div>
                        )}

                        {encResult && (
                            <div className="flex flex-col gap-2">
                                <div className="grid grid-cols-3 gap-2 text-xs" style={{ fontFamily: 'monospace' }}>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Frame</div>
                                        <div className="text-gray-200">{encResult.frame_bytes} bytes</div>
                                    </div>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Duration</div>
                                        <div className="text-gray-200">{encResult.duration_ms} ms</div>
                                    </div>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Repeats</div>
                                        <div className="text-gray-200">5×</div>
                                    </div>
                                </div>
                                <a
                                    href={encResult.download_url}
                                    download="flipper_tx.sub"
                                    className="inline-flex items-center gap-2 px-4 py-2 rounded text-sm font-semibold self-start"
                                    style={{ background: '#1e4a3f', color: '#22c55e', border: '1px solid #22c55e44' }}
                                >
                                    ↓ Download flipper_tx.sub
                                </a>
                            </div>
                        )}
                    </div>

                    {/* ── Decode section ── */}
                    <div className="rounded-lg p-4 flex flex-col gap-3" style={{ background: '#16213e', border: '1px solid #1e3a5f' }}>
                        <h2 className="text-xs font-semibold tracking-widest text-gray-500 uppercase">Decode .sub → Message</h2>

                        {/* Drop zone */}
                        <div
                            onClick={() => fileInputRef.current?.click()}
                            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                            onDragLeave={() => setDragOver(false)}
                            onDrop={onDrop}
                            className="rounded-lg flex flex-col items-center justify-center gap-2 py-8 cursor-pointer transition-colors text-sm"
                            style={{
                                border: `2px dashed ${dragOver ? '#00d2ff' : '#1e3a5f'}`,
                                background: dragOver ? '#0f1f3a' : '#0f3460',
                                color: dragOver ? '#00d2ff' : '#6b7280',
                            }}
                        >
                            <span className="text-2xl opacity-50">⌨</span>
                            <span>{decoding ? 'Decoding…' : 'Drop a .sub file here or click to upload'}</span>
                        </div>
                        <input ref={fileInputRef} type="file" accept=".sub" onChange={onFileChange} className="hidden" />

                        {decError && (
                            <div className="text-xs px-3 py-2 rounded" style={{ background: '#2a1e2e', color: '#e94560' }}>⚠ {decError}</div>
                        )}

                        {decResult && (
                            <div className="flex flex-col gap-3">
                                {/* Stats */}
                                <div className="grid grid-cols-3 gap-2 text-xs" style={{ fontFamily: 'monospace' }}>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Frequency</div>
                                        <div className="text-gray-200">{decResult.frequency ? (decResult.frequency / 1e6).toFixed(2) + ' MHz' : '—'}</div>
                                    </div>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Durations</div>
                                        <div className="text-gray-200">{decResult.duration_count}</div>
                                    </div>
                                    <div className="rounded px-3 py-2" style={{ background: '#0f3460' }}>
                                        <div className="text-gray-500 mb-0.5">Bits</div>
                                        <div className="text-gray-200">{decResult.bit_count}</div>
                                    </div>
                                </div>

                                {/* Decoded messages */}
                                {decResult.unique.length > 0 ? (
                                    <div className="flex flex-col gap-1">
                                        <div className="text-xs text-gray-500 mb-1">
                                            {decResult.unique.length} unique message{decResult.unique.length !== 1 ? 's' : ''} ({decResult.messages.length} total)
                                        </div>
                                        {decResult.unique.map((msg, i) => (
                                            <div key={i} className="px-3 py-2 rounded text-sm" style={{ background: '#1e3a2f', color: '#22c55e', fontFamily: 'monospace', border: '1px solid #22c55e22' }}>
                                                {msg}
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-sm text-center py-3" style={{ color: '#e94560' }}>
                                        No messages decoded — CRC/preamble mismatch
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* ── Instructions ── */}
                    <div className="rounded-lg p-4 text-xs flex flex-col gap-2" style={{ background: '#16213e', border: '1px solid #1e3a5f', color: '#6b7280' }}>
                        <div className="text-gray-400 font-semibold mb-1">Workflow</div>
                        <div>1. Type message → Generate .sub → download file</div>
                        <div>2. Copy flipper_tx.sub to Flipper SD card → Sub-GHz → Saved → Send</div>
                        <div>3. To decode a capture: drop the .sub file in the box above</div>
                        <div className="mt-2 pt-2" style={{ borderTop: '1px solid #1e3a5f', color: '#4a6a8f' }}>
                            Note: CC1101 (Flipper) has a ~35 kHz frequency offset vs HackRF at 915 MHz.
                            Fine-tune on the Flipper if packets are missed.
                        </div>
                    </div>
                </div>
            );
        }

        const PAGES = {
            dashboard: DashboardPage,
            comms:     CommsPage,
            scanner:   ScannerPage,
            adsb:      AdsbPage,
            fm:        FmPage,
            signals:   SignalsPage,
            flipper:   FlipperPage,
        };

        // ── Sidebar ────────────────────────────────────────────
        function Sidebar({ activePage, onNavigate }) {
            return (
                <aside
                    className="flex flex-col w-52 flex-shrink-0 h-screen"
                    style={{ background: '#0f3460', borderRight: '1px solid #1e3a5f' }}
                >
                    {/* Logo */}
                    <div className="px-4 py-5" style={{ borderBottom: '1px solid #1e3a5f' }}>
                        <div className="text-sm font-bold tracking-widest" style={{ color: '#00d2ff' }}>
                            HACKRF
                        </div>
                        <div className="text-xs text-gray-400 tracking-widest">COMMS</div>
                    </div>

                    {/* Nav items */}
                    <nav className="flex-1 py-3 overflow-y-auto">
                        {NAV_ITEMS.map(item => {
                            const active = activePage === item.id;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => onNavigate(item.id)}
                                    className="w-full flex items-center gap-3 px-4 py-2.5 text-sm transition-colors"
                                    style={{
                                        background: active ? '#16213e' : 'transparent',
                                        color: active ? '#00d2ff' : '#94a3b8',
                                        borderLeft: active ? '2px solid #00d2ff' : '2px solid transparent',
                                    }}
                                >
                                    <span className="text-base w-5 text-center opacity-80">{item.icon}</span>
                                    {item.label}
                                </button>
                            );
                        })}
                    </nav>

                    {/* Footer */}
                    <div className="px-4 py-3 text-xs text-gray-600" style={{ borderTop: '1px solid #1e3a5f' }}>
                        web/lightweight
                    </div>
                </aside>
            );
        }

        // ── Header ─────────────────────────────────────────────
        function Header({ activePage, connected }) {
            const item = NAV_ITEMS.find(n => n.id === activePage);
            return (
                <header
                    className="flex items-center justify-between px-6 py-3 flex-shrink-0"
                    style={{ background: '#16213e', borderBottom: '1px solid #1e3a5f' }}
                >
                    <div className="flex items-center gap-3">
                        <span className="text-lg">{item?.icon}</span>
                        <span className="text-sm font-semibold text-gray-200">{item?.label}</span>
                    </div>
                    <div className="flex items-center gap-2 text-xs text-gray-400">
                        <StatusDot connected={connected} />
                        <span>{connected === null ? 'connecting…' : connected ? 'API connected' : 'API offline'}</span>
                    </div>
                </header>
            );
        }

        // ── Layout ─────────────────────────────────────────────
        function Layout({ children, activePage, onNavigate, connected }) {
            return (
                <div className="flex h-screen overflow-hidden" style={{ background: '#1a1a2e' }}>
                    <Sidebar activePage={activePage} onNavigate={onNavigate} />
                    <div className="flex flex-col flex-1 overflow-hidden">
                        <Header activePage={activePage} connected={connected} />
                        <main className="flex-1 overflow-auto p-6">
                            {children}
                        </main>
                    </div>
                </div>
            );
        }

        // ── App ────────────────────────────────────────────────
        function App() {
            const [activePage, setActivePage] = useState('dashboard');
            const [connected, setConnected]   = useState(null); // null=checking, true, false

            useEffect(() => {
                fetch('/api/health')
                    .then(r => r.ok ? r.json() : Promise.reject())
                    .then(() => setConnected(true))
                    .catch(() => setConnected(false));
            }, []);

            const PageComponent = PAGES[activePage] || DashboardPage;

            return (
                <Layout activePage={activePage} onNavigate={setActivePage} connected={connected}>
                    <PageComponent />
                </Layout>
            );
        }

        // ═══════════════════════════════════════════════════════
        // MOUNT
        // ═══════════════════════════════════════════════════════
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
